/* ---------- Seitenansicht: der Handzettel selbst ist die Bedienfläche ---------- */
const sortedWeeks = () => [...weeks].sort((a, b) => weekDates(a).from.localeCompare(weekDates(b).from));
function flyerForWeek(week) {
  const { from } = weekDates(week);
  let flyer = state.flyers.find((f) => f.from === from);
  if (!flyer) { flyer = flyerFromWeek(week, 'entwurf'); state.flyers.push(flyer); saveState(); }
  return flyer;
}
/** Beim Öffnen: die laufende Kalenderwoche, sonst die jüngste Woche von Lüning, sonst ein leerer Handzettel. */
function defaultFlyer() {
  const today = todayIso();
  const list = sortedWeeks();
  const week = list.find((w) => { const d = weekDates(w); return d.from <= today && today <= addDays(d.from, 6); }) || list.at(-1);
  if (week) return flyerForWeek(week);
  const from = mondayOf(today);
  let flyer = state.flyers.find((f) => f.from === from);
  if (!flyer) { flyer = emptyFlyer(from); state.flyers.push(flyer); saveState(); }
  return flyer;
}
const emptyFlyer = (from) => applyTemplate({ id: uid(), from, to: addDays(from, 5), status: 'entwurf', stimmung: moodFor(from), kopf: null, items: [] });
const WEEKS_AHEAD = 8;
/** Nachbarwoche: Handzettel von Lüning, sonst ein schon angelegter, sonst (nur nach vorn) ein leerer zum Füllen aus der Vororder. */
function neighbourWeek(flyer, offset) {
  const from = addDays(mondayOf(flyer.from), offset * 7);
  const week = weeks.find((w) => weekDates(w).from === from);
  if (week) return () => go('home', flyerForWeek(week).id);
  const saved = state.flyers.find((f) => mondayOf(f.from) === from);
  if (saved) return () => go('home', saved.id);
  if (offset < 0 || from > addDays(mondayOf(todayIso()), WEEKS_AHEAD * 7)) return null;
  return () => { const fresh = emptyFlyer(from); state.flyers.push(fresh); saveState(); go('home', fresh.id); };
}

/* Ziehen und Ablegen mit Zeigerereignissen, damit es mit Maus und Finger gleich funktioniert.
   Maus: ziehen ab 8 Pixel Bewegung. Finger: kurz gedrückt halten, sonst würde die Seite nicht mehr scrollen. */
const HOLD_MS = 320;
const drag = { active: false, lastClickBlocked: false };
function attachDrag(node, flyer, item, fromPool = false) {
  node.addEventListener('contextmenu', (event) => event.preventDefault());

    if (drag.lastClickBlocked) { drag.lastClickBlocked = false; return; }

    let flipHover = null; let flipTimer = 0;
    // Artikel kurz über einem Pfeil halten: der Handzettel blättert um, der Artikel kann auf der anderen Seite abgelegt werden.
    const hoverFlip = (button) => {
      if (button === flipHover) return;
      if (flipHover) flipHover.classList.remove('drop');
      clearInterval(flipTimer);
      flipHover = button;
      if (!button) return;
      button.classList.add('drop');
      flipTimer = setInterval(() => turnTo(ui.sheet + Number(button.dataset.flip)), 700);
    };
    const begin = () => {
      drag.active = true;

      ghost.style.transform = `translate(${x}px, ${y}px)`;

      hoverFlip(arrow && !arrow.disabled ? arrow : null);
      const next = under ? under.closest('[data-item]') : null;
      const valid = next && next !== node ? next : null;

      target = valid;
      if (target) target.classList.add('drop');

      drag.lastClickBlocked = true;
      setTimeout(() => { drag.lastClickBlocked = false; }, 350);
      if (!target) return;
      target.classList.remove('drop');
      const other = flyer.items.find((i) => i.id === target.dataset.item);
      if (!other) return;
      if (fromPool) placeItem(flyer, item, other.id);
      else swapItems(flyer, item.id, other.id);
      saveState();
      render();

/** Markenband links: Hauptangebot frei auf der Seite verschieben (ziehen); antippen öffnet den Artikel. */
function attachFreeMove(hit, canvas, flyer, item, figure) {
  hit.style.touchAction = 'none';
  hit.style.cursor = 'move';
  hit.setAttribute('aria-label', `${item.name}, ${formatPrice(item.price)} €. Antippen zum Ändern, ziehen zum Verschieben.`);
  let moved = false;
  hit.addEventListener('click', () => { if (moved) { moved = false; return; } openItemDialog(flyer, item); });
  hit.addEventListener('pointerdown', (down) => {
    if (down.pointerType === 'mouse' && down.button !== 0) return;
    moved = false;
    const frame = figure.querySelector('.scale-handle');
    hit.setPointerCapture(down.pointerId);
    const move = (event) => {
      const dx = event.clientX - down.clientX;
      const dy = event.clientY - down.clientY;
      if (!moved && Math.hypot(dx, dy) < 6) return;
      moved = true;
      hit.style.transform = `translate(${dx}px, ${dy}px)`;
      if (frame) { frame.style.transform = `translate(${dx}px, ${dy}px)`; frame.classList.add('moving'); }
    };
    const finish = () => {
      hit.removeEventListener('pointermove', move);
      hit.removeEventListener('pointerup', finish);
      hit.removeEventListener('pointercancel', finish);
      if (!moved) return;
      const area = canvas.getBoundingClientRect();
      const now = hit.getBoundingClientRect();
      flyer.mainPos = { x: (now.left - area.left) / area.width, y: (now.top - area.top) / area.height };
      saveState();
      render();
    };
    hit.addEventListener('pointermove', move);
    hit.addEventListener('pointerup', finish);
    hit.addEventListener('pointercancel', finish);
  });
}
/** Rezept-Band: antippen öffnet das Rezept, ziehen nach oben, in die Mitte oder nach unten. */
function recipeHandle(canvas, flyer) {
  const box = canvas.slots.recipeBox;
  const pct = (value, total) => `${(value / total * 100).toFixed(3)}%`;
  const hit = el('button', { type: 'button', class: 'slot recipe-slot', 'aria-label': 'Rezept der Woche. Antippen zum Bearbeiten, ziehen für oben, Mitte oder unten.',
    style: `left:${pct(box.x, canvas.width)};top:${pct(box.y, canvas.height)};width:${pct(box.w, canvas.width)};height:${pct(box.h, canvas.height)};cursor:move;touch-action:none` });
  let moved = false;
  hit.addEventListener('click', () => { if (moved) { moved = false; return; } openRecipeDialog(flyer); });
  hit.addEventListener('pointerdown', (down) => {
    if (down.pointerType === 'mouse' && down.button !== 0) return;
    moved = false;
    hit.setPointerCapture(down.pointerId);
    const move = (event) => {
      const dy = event.clientY - down.clientY;
      if (!moved && Math.abs(dy) < 8) return;
      moved = true;
      hit.style.transform = `translateY(${dy}px)`;
      hit.classList.add('dragging');
    };
    const finish = () => {
      hit.removeEventListener('pointermove', move);
      hit.removeEventListener('pointerup', finish);
      hit.removeEventListener('pointercancel', finish);
      if (!moved) return;
      const area = canvas.getBoundingClientRect();
      const now = hit.getBoundingClientRect();
      const c = (now.top + now.height / 2 - area.top) / area.height;
      flyer.rezept = { ...recipeOf(flyer), pos: c < 0.38 ? 'oben' : c < 0.62 ? 'mitte' : 'unten' };
      saveState();
      render();
    };
    hit.addEventListener('pointermove', move);
    hit.addEventListener('pointerup', finish);
    hit.addEventListener('pointercancel', finish);
  });
  return hit;
}

/** Seiten auffüllen (Marco 15.10.): freie Plätze mit Artikeln aus dem Lüning-Sortiment füllen, zum empfohlenen Preis,
    nach Warengruppen geordnet (Leser mögen Handzettel nach Gängen sortiert), Artikel mit gutem Bild zuerst. */
function fillPages(flyer) {
  const free = slotCount(flyer) - flyer.items.length;
  if (free <= 0) { toast('Alle Plätze sind schon belegt.'); return; }
  const taken = new Set(flyer.items.map((i) => i.ean).filter(Boolean));
  const order = (g) => { const k = catalogue.groups.indexOf(g); return k < 0 ? 999 : k; };
  const pick = catalogue.list
    .filter((e) => !taken.has(e.ean) && e.lvp > 0 && e.px >= MIN_PX_TILE)
    .sort((a, b) => order(a.group) - order(b.group) || b.px - a.px)
    .slice(0, free)
    .map((e) => ({ ...itemFromCatalogue(e, e.lvp), aufgefuellt: true }));
  if (!pick.length) { toast('Im Sortiment sind keine weiteren Artikel mit Bild.'); return; }
  flyer.items.push(...pick);
  saveState();
  render();
  toast(`${pick.length} Artikel ergänzt, zum empfohlenen Lüning-Preis. Bitte Preise prüfen.`);
}

/** Rezepte der Sammlung, das passendste zuerst (Treffer in den Angeboten, dann Jahreszeit). */

function mainScaleHandle(canvas, flyer) {

  const pct = (value, total) => `${(value / total * 100).toFixed(3)}%`;
  const handle = el('div', { class: 'scale-handle', style: `left:${pct(box.x, canvas.width)};top:${pct(box.y, canvas.height)};width:${pct(box.w, canvas.width)};height:${pct(box.h, canvas.height)}` },
    el('span', { class: 'scale-label', text: `${Math.round(box.scale * 100)} %` }),
    (flyer.mainScale && flyer.mainScale !== MAIN_SCALE.base) ? el('button', { type: 'button', class: 'scale-reset', title: 'Hauptangebot wieder an seinen Platz und in Originalgröße',
      onclick: (event) => { event.stopPropagation(); delete flyer.mainPos; delete flyer.mainScale; saveState(); render(); } }, 'Zurück an den Platz') : null,
    ['nw', 'ne', 'sw', 'se'].map((corner) => el('span', { class: `grip ${corner}`, title: 'Ziehen: Hauptangebot größer oder kleiner', 'aria-label': 'Hauptangebot skalieren' })));

  handle.style.transformOrigin = fromBottomRight ? '100% 100%' : '0 0';
  for (const grip of handle.querySelectorAll('.grip')) {
    grip.addEventListener('pointerdown', (down) => {
      if (down.pointerType === 'mouse' && down.button !== 0) return;
      down.stopPropagation();
      down.preventDefault();
      const r = handle.getBoundingClientRect();
      const ax = fromBottomRight ? r.right : r.left;
      const ay = fromBottomRight ? r.bottom : r.top;
      const startReach = Math.hypot(down.clientX - ax, down.clientY - ay) || 1;
      const limit = { min: MAIN_SCALE.min / box.scale, max: MAIN_SCALE.max / box.scale };
      let factor = 1;
      let moved = false;
      grip.setPointerCapture(down.pointerId);
      const move = (event) => {
        moved = true;
        factor = Math.min(limit.max, Math.max(limit.min, Math.hypot(event.clientX - ax, event.clientY - ay) / startReach));
        handle.style.transform = `scale(${factor})`;
        handle.classList.add('moving');
        handle.firstChild.textContent = `${Math.round(box.scale * factor * 100)} %`;
      };

        grip.removeEventListener('pointermove', move);
        grip.removeEventListener('pointerup', finish);

        saveState();
        render();
        toast(`Hauptangebot: ${Math.round(mainScaleOf(flyer) * 100)} %`);
      };
      grip.addEventListener('pointermove', move);
      grip.addEventListener('pointerup', finish);
      grip.addEventListener('pointercancel', finish);
    });
  }

}

/** Rezept als eigenes Bild für soziale Netzwerke (Hochformat 4:5): Bild oben, Rezept darunter, Markt unten. */
function drawRecipeShare(flyer, settings, images) {
  const W = 1080; const H = 1350;
  const canvas = el('canvas', { width: W, height: H });
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, W, H);
  const barH = 120;
  // Rezept-Band in voller Breite, hochkant: Bild oben (55 %), Text darunter
  const img = images.get('rezept');
  const picH = Math.round(H * 0.5);
  if (img) drawCover(ctx, img, 0, 0, W, picH); else { ctx.fillStyle = tint(settings.farbeKopf, 0.55); ctx.fillRect(0, 0, W, picH); }
  const textImages = new Map();
  const r = recipeOf(flyer);
  // Text: gleiche Darstellung wie im Handzettel; das Band ist doppelt so breit und um eine Bildbreite verschoben,
  // so landet nur seine Textspalte auf dem Bild
  const box = { x: 0, y: picH, w: W * 2 + 80, h: H - picH - barH + 60 };   // Ränder der Karte liegen außerhalb des Bildes
  ctx.save();
  ctx.beginPath(); ctx.rect(0, picH, W, H - picH - barH); ctx.clip();
  ctx.translate(-box.w / 2, 0);
  drawRecipeBand(ctx, box.x, box.y, box.w, box.h, { rezept: { ...r }, rezeptAus: false }, settings, textImages);
  ctx.restore();
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, picH - 1, W, 1);
  ctx.fillStyle = settings.farbePreis;
  ctx.fillRect(0, H - barH, W, barH);
  drawLogoPanel(ctx, W - 40 - 330, H - barH + (barH - 110) / 2, 330, settings, images);
  ctx.fillStyle = '#FFFFFF';
  ctx.textAlign = 'left';
  ctx.font = textFont(30, 700);
  ctx.fillText('Alle Zutaten diese Woche im Angebot', 40, H - barH + 52);
  ctx.font = textFont(24, 400);
  ctx.fillText(`${settings.marktName} · ${flyerRange(flyer)}`, 40, H - barH + 88);
  return canvas;
}
function recipePostText(flyer) {
  const r = recipeOf(flyer);
  if (!r.titel) return '';
  const lines = [`Rezept der Woche: ${r.titel}${r.dauer ? ` (${r.dauer})` : ''}`, '', 'Zutaten:', ...(r.zutaten || []).map((z) => `• ${z}`), '', 'So geht’s:', ...(r.schritte || []).map((t, i) => `${i + 1}. ${t}`), '', `Alle Zutaten diese Woche im ${state.settings.marktName} – rund um die Uhr geöffnet.`];

async function prepareShots(flyer) {

const PDF_MAKER = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
let pdfMaker = null;
function loadPdfMaker() {
  if (!pdfMaker) {
    pdfMaker = new Promise((resolve, reject) => {
      const script = el('script', { src: PDF_MAKER });
      script.addEventListener('load', () => (window.jspdf && window.jspdf.jsPDF ? resolve(window.jspdf.jsPDF) : reject(new Error('PDF fehlt'))));
      script.addEventListener('error', () => { pdfMaker = null; reject(new Error('PDF nicht ladbar')); });
      document.head.append(script);
    });
  }
  return pdfMaker;
}
const blobToDataUrl = (blob) => new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(r.result); r.onerror = reject; r.readAsDataURL(blob); });
async function jpegOf(blob, quality = 0.9) {
  const img = await loadImage(URL.createObjectURL(blob));
  const c = el('canvas', { width: img.naturalWidth, height: img.naturalHeight });
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(img, 0, 0);
  return c.toDataURL('image/jpeg', quality);
}
async function savePdf(flyer, shots, deliver = saveFile) {

  try {

    const doc = new JsPdf({ orientation: 'portrait', unit: 'mm', format: 'a4', compress: true });
    for (let i = 0; i < shots.seiten.length; i += 1) {
      if (i) doc.addPage('a4', 'portrait');
      doc.addImage(await jpegOf(shots.seiten[i].blob), 'JPEG', 0, 0, 210, 297);
    }
    await deliver(`Handzettel_KW${isoWeek(flyer.from)}.pdf`, doc.output('blob'));
  } catch (error) { toast('Das PDF ließ sich nicht erstellen. Bitte Internetverbindung prüfen und noch einmal versuchen.'); }

    const link = katalogLinkOf(flyer);
    const [JsPdf, qr] = await Promise.all([loadPdfMaker(), qrImage(link)]);
    const settings = state.settings;
    const W = 1240; const H = 1754;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = settings.farbePreis; ctx.fillRect(0, 0, W, H * 0.2);
    ctx.textAlign = 'center';
    ctx.fillStyle = settings.farbeKopf; ctx.font = textFont(96, 900);
    ctx.fillText(settings.marktName, W / 2, H * 0.1);
    ctx.fillStyle = '#FFFFFF'; ctx.font = textFont(48, 600);
    ctx.fillText(settings.zusatz || '', W / 2, H * 0.165);
    ctx.fillStyle = '#111111'; ctx.font = textFont(88, 900);
    ctx.fillText('Unsere Angebote', W / 2, H * 0.29);
    ctx.font = textFont(56, 600);
    ctx.fillText('jede Woche neu zum Durchblättern', W / 2, H * 0.335);
    const size = W * 0.56; const qx = (W - size) / 2; const qy = H * 0.38;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(qr, qx, qy, size, size);
    ctx.fillStyle = settings.farbeKopf; ctx.fillRect(0, H * 0.82, W, H * 0.18);
    ctx.fillStyle = '#111111'; ctx.font = textFont(60, 900);
    ctx.fillText('Mit der Handy-Kamera scannen', W / 2, H * 0.885);
    ctx.font = textFont(30, 400);
    ctx.fillText(link.replace(/^https?:\/\//, ''), W / 2, H * 0.94);
    const doc = new JsPdf({ orientation: 'portrait', unit: 'mm', format: 'a4', compress: true });
    doc.addImage(c.toDataURL('image/png'), 'PNG', 0, 0, 210, 297);
    await saveFile('QR-Aushang_Handzettel.pdf', doc.output('blob'));
  } catch (error) { toast('Der QR-Aushang ließ sich nicht erstellen. Bitte Internetverbindung prüfen und noch einmal versuchen.'); }
}
function shareText(flyer) {
  const link = katalogLinkOf(flyer);
  return `Unsere Angebote ${flyerTitle(flyer)} im ${state.settings.marktName}, gültig ${flyerRange(flyer)}.${link ? `\nZum Durchblättern: ${link}` : ''}`;
}
/* Teilen über das Teilen-Menü des Geräts (Marco 16.10.): am Handy gehen Bild oder PDF direkt an WhatsApp, Facebook,
   Instagram, Telegram, E-Mail … Wo das Gerät keine Dateien weitergeben kann (PC, Vorschau in claude.ai), wird die Datei
   gespeichert und ein Fenster zeigt die Netzwerke zum Hochladen. */
async function shareFiles(flyer, files) {
  const text = shareText(flyer);
  try {
    if (navigator.canShare && navigator.canShare({ files })) { await navigator.share({ files, text }); return; }
  } catch (error) { if (error && error.name === 'AbortError') return; }
  openShareFallback(flyer, files);
}
function openShareFallback(flyer, files) {
  const isPdf = files.some((f) => f.type === 'application/pdf');
  openDialog('Teilen', ({ body, foot, close }) => {
    const link = katalogLinkOf(flyer);
    const text = shareText(flyer);
    const open = (url) => window.open(url, '_blank', 'noopener');
    const save = el('button', { type: 'button', class: 'primary', onclick: async () => { for (const f of files) await saveFile(f.name, f); } },
      files.length > 1 ? `1. Alle ${files.length} Bilder speichern` : `1. ${isPdf ? 'PDF' : 'Bild'} speichern`);
    body.append(
      el('p', { text: 'Dieses Gerät gibt Dateien nicht direkt an andere Apps weiter. So geht es trotzdem:' }), save,
      el('p', { text: '2. Netzwerk öffnen und die gespeicherte Datei dort hochladen:' }),
      el('div', { class: 'row' },
        el('button', { type: 'button', class: 'share-wa', onclick: () => open(`https://wa.me/?text=${encodeURIComponent(text)}`) }, 'WhatsApp'),
        el('button', { type: 'button', class: 'share-fb', onclick: () => open(link ? `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(link)}` : 'https://www.facebook.com/') }, 'Facebook'),
        el('button', { type: 'button', class: 'share-ig', onclick: () => open('https://www.instagram.com/') }, 'Instagram')),
      el('p', { class: 'small muted', text: isPdf
        ? 'Hinweis: WhatsApp, Telegram und E-Mail nehmen PDF-Dateien. Instagram nimmt keine PDF – dafür die Einzelbilder nehmen.'
        : 'Am Handy erscheint statt dieses Fensters direkt das Teilen-Menü mit allen Apps.' }));
    foot.append(el('button', { type: 'button', onclick: close }, 'Schließen'));
  });
}
const fileOf = (shot) => new File([shot.blob], shot.name, { type: shot.blob.type || 'image/png' });
function viewShare(flyer) {
  const isDraft = flyer.status === 'entwurf';
  if (!ui.shots || ui.shots.flyerId !== flyer.id) {
    prepareShots(flyer).then((shots) => {
      if (ui.view === 'share' && ui.flyerId === flyer.id) { ui.shots = shots; render(); }
      else shots.urls.forEach((u) => URL.revokeObjectURL(u));
    }).catch(() => toast('Die Bilder konnten nicht erstellt werden. Bitte noch einmal versuchen.'));
  }
  const shots = ui.shots && ui.shots.flyerId === flyer.id ? ui.shots : null;
  const strip = (list, label) => el('div', { class: 'strip' }, list.map((shot, i) => el('figure', { class: 'shot', style: 'margin:0' },
    el('img', { src: shot.url, alt: `${label} ${i + 1} von ${list.length}` }),
    el('figcaption', { class: 'small muted', text: `${label} ${i + 1} von ${list.length}` }),
    el('div', { class: 'row' },
      el('button', { type: 'button', onclick: () => saveFile(shot.name, shot.blob) }, 'Speichern'),
      el('button', { type: 'button', class: 'share-btn', onclick: () => shareFiles(flyer, [fileOf(shot)]) }, 'Teilen')))));
  const text = el('textarea', { id: 'post-text', readonly: true }, postText(flyer));
  return [
    el('div', { class: 'topbar' }, el('div', { class: 'brand', text: `Handzettel ${flyerTitle(flyer)}` }), el('span', { class: 'muted', text: flyerRange(flyer) })),
    isDraft ? stepsBar(3) : null,
    el('h1', { text: isDraft ? 'Fertig zum Teilen' : `Handzettel ${flyerTitle(flyer)}` }),
    !shots ? el('p', { class: 'muted', text: 'Die Bilder werden erstellt …' }) : [
      el('section', { class: 'stack' },
        el('h2', { text: 'Ganzer Handzettel' }),
        el('p', { class: 'muted', text: 'Alle Seiten in einer Datei: als PDF speichern oder direkt teilen, als Blätterkatalog zum Online-Stellen speichern.' }),
        el('div', { class: 'row' },
          el('button', { type: 'button', class: 'primary', onclick: () => savePdf(flyer, shots) }, 'PDF speichern'),
          el('button', { type: 'button', class: 'share-btn', onclick: () => savePdf(flyer, shots, (name, blob) => shareFiles(flyer, [new File([blob], name, { type: 'application/pdf' })])) }, 'PDF teilen'),
          el('button', { type: 'button', onclick: () => saveFlipbook(flyer, shots) }, 'Blätterkatalog speichern'),
          el('button', { type: 'button', onclick: () => saveQrPoster(flyer) }, 'QR-Aushang drucken')),
        el('p', { class: 'small muted', text: `Der Blätterkatalog wird als „${KATALOG_DATEI}“ gespeichert. Jede Woche auf GitHub in den Ordner „katalog“ hochladen (ersetzt die alte Woche) – dann zeigt der feste Link immer den aktuellen Handzettel: ${katalogLinkOf(flyer)}. Den QR-Aushang nur einmal drucken, er bleibt gültig.` }),
        el('p', { class: 'small muted', text: '„PDF teilen“ öffnet am Handy das Teilen-Menü (WhatsApp, Facebook, Telegram, E-Mail …).' })),
      el('section', { class: 'stack' },
        el('h2', { text: 'Einzelbilder' }),
        el('p', { class: 'muted', text: 'Für Instagram, Facebook und den WhatsApp-Status: in dieser Reihenfolge hochladen.' }),
        el('div', { class: 'row' }, el('button', { type: 'button', class: 'share-btn', onclick: () => shareFiles(flyer, shots.phone.map(fileOf)) }, `Alle ${shots.phone.length} Bilder teilen`)),
        strip(shots.phone, 'Bild')),
      shots.rezept && shots.rezept.length ? el('section', { class: 'stack' },
        el('h2', { text: 'Rezept der Woche' }),
        el('p', { class: 'muted', text: 'Eigenes Bild mit Text für Facebook, Instagram und WhatsApp – macht Lust auf die Angebote.' }),
        strip(shots.rezept, 'Rezept'),
        (() => {
          const area = el('textarea', { readonly: true, rows: 8 }, recipePostText(flyer));
          return el('div', { class: 'stack' }, area, el('button', { type: 'button', onclick: async () => {
            try { await navigator.clipboard.writeText(area.value); toast('Text kopiert.'); } catch (error) { area.focus(); area.select(); toast('Text ist markiert. Jetzt kopieren.'); }
          } }, 'Rezept-Text kopieren'));
        })()) : null,
    ],
    el('section', { class: 'stack' },
      el('h2', { text: 'Text für den Beitrag' }),
      el('label', { for: 'post-text', class: 'small muted', text: 'Kann unter die Bilder gesetzt werden' }),
      text,
      el('button', { type: 'button', onclick: async () => {
        try { await navigator.clipboard.writeText(text.value); toast('Text kopiert.'); }
        catch (error) { text.focus(); text.select(); toast('Text ist markiert. Jetzt kopieren.'); }
      } }, 'Text kopieren')),
    el('div', { class: 'actionbar' },
      el('button', { type: 'button', class: 'back', onclick: () => go(isDraft ? 'check' : 'home', isDraft ? flyer.id : null) }, 'Zurück'),
      isDraft
        ? el('button', { type: 'button', class: 'primary', onclick: () => { flyer.status = 'fertig'; for (const item of flyer.items) item.carried = false; saveState(); go('home', null); toast(`Handzettel ${flyerTitle(flyer)} ist abgeschlossen.`); } }, 'Abschließen')
        : el('button', { type: 'button', class: 'primary', onclick: () => go('home', null) }, 'Zur Übersicht')),
  ];
}

function render() {
  // Ausgangsstand für „Rückgängig“ merken, sobald eine Woche geöffnet ist
  const snap = snapFlyer();
  if (snap && (!history.last || history.last.id !== snap.id)) { history.last = snap; history.list = []; }
  const app = document.getElementById('app');
  let view = ui.view;
  let flyer = currentFlyer();
  if (!flyer) { flyer = defaultFlyer(); ui.flyerId = flyer.id; view = 'home'; }
  app.className = 'studio';
  let content;
  if (view === 'check' || view === 'share') {
    // Schritt 2 und 3 mit derselben Werkzeugleiste links wie in der Werkstatt
    const page = el('div', { class: view === 'share' ? 'wrap wide' : 'wrap' }, ...kids(view === 'check' ? viewCheck(flyer) : viewShare(flyer)));
    content = el('div', { class: 'studio-main' }, studioTools(flyer, view), el('main', { class: 'studio-canvas studio-page' }, page));
  } else content = viewBoard(flyer);
  app.replaceChildren(...kids(content));
  if (view === 'home') { fitBook(); requestAnimationFrame(fitBook); }
}

async function start() {
  await Promise.all([loadCatalogue(), loadWeeks()]);
  state = loadState() || seedState();
  state.settings = { ...DEFAULT_SETTINGS, ...state.settings };
  // Frühere Fassungen hatten geschätzte Farben; jetzt gelten die Werte aus dem Markenpaket.
  if (state.settings.farbePreis.toUpperCase() === '#BE175D') state.settings.farbePreis = DEFAULT_SETTINGS.farbePreis;
  if (state.settings.farbeKopf.toUpperCase() === '#FFE32F') state.settings.farbeKopf = DEFAULT_SETTINGS.farbeKopf;
  if (!Array.isArray(state.eigene)) state.eigene = [];
  // 15.10.: „Holz hell“ heißt jetzt „Holz“
  for (const f of state.flyers) if (f.hintergrund === 'holzhell') f.hintergrund = 'holz';
  if (state.vorlage && state.vorlage.hintergrund === 'holzhell') state.vorlage.hintergrund = 'holz';
  if (!Array.isArray(state.personen)) state.personen = [];
  if (!state.themenBilder || typeof state.themenBilder !== 'object') state.themenBilder = {};
  // Handzettel aus früheren Fassungen: lange Lüning-Namen einmalig kürzen
  for (const flyer of state.flyers) for (const item of flyer.items) if (item.bild && item.langName === undefined) shortenItem(item);
  render();
  document.fonts.ready.then(fitBook);
}
start();
})();
</script>
