<!doctype html><html lang="de"><head><meta charset="utf-8"><title>iOFlyGen</title><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>iOFlyGen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bebas+Neue&family=Kaushan+Script&family=Titillium+Web:wght@400;600;700;900&display=swap">
<style>
/* Aufbau: eine ruhige Spalte am Handy; am Desktop teilt der Goldene Schnitt die Fläche
   in Arbeitsbereich (61,8 %) und Vorschau (38,2 %). Abstände und Schriftgrößen folgen
   der Fibonacci-Reihe (5, 8, 13, 21, 34, 55). Bewusst ein einziges, helles Erscheinungsbild. */
:root {
  color-scheme: light;
  --bg: #F5F6F2;
  --surface: #FFFFFF;
  --ink: #1B2420;
  --muted: #5C665F;
  --line: #D9DDD3;
  --accent: #0F6D5C;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3F1EC;
  --warn: #9A4B00;
  --warn-soft: #FFF1DC;
  --danger: #A8261C;
  --star: #C98A00;
  --s1: 5px; --s2: 8px; --s3: 13px; --s4: 21px; --s5: 34px; --s6: 55px;
  --t-small: 13px; --t-body: 16px; --t-lead: 21px; --t-title: 34px;
  --radius: 13px;
  --font: "Atkinson Hyperlegible", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: var(--t-body); line-height: 1.45;
  padding-inline: 16px; padding-block: var(--s4) var(--s6);
}
h1, h2, h3, p { margin: 0; }
h1 { font-size: var(--t-title); line-height: 1.15; text-wrap: balance; }
h2 { font-size: var(--t-lead); line-height: 1.25; text-wrap: balance; }
h3 { font-size: var(--t-body); }
.muted { color: var(--muted); }
.small { font-size: var(--t-small); }
.wrap { max-width: 720px; margin-inline: auto; display: flex; flex-direction: column; gap: var(--s4); }
.wrap.wide { max-width: 1165px; }
.stack { display: flex; flex-direction: column; gap: var(--s3); }
.row { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
.spread { justify-content: space-between; }
.grow { flex: 1 1 0; min-width: 0; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); }
.brand { font-weight: 700; font-size: var(--t-lead); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--s4); }

button, .btn {
  font: inherit; font-weight: 700; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  min-height: 48px; padding: var(--s2) var(--s4); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); text-align: center;
}
button:hover { border-color: var(--ink); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .item-main:focus-visible {
  outline: 3px solid var(--accent); outline-offset: 2px;
}
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

button.icon { min-width: 48px; padding: 0; font-size: var(--t-lead); }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button.star-on { color: var(--star); border-color: var(--star); }

.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s2); list-style: none; margin: 0; padding: 0; }
.steps li { border-top: 5px solid var(--line); padding-top: var(--s2); font-size: var(--t-small); color: var(--muted); }
.steps li.now { border-color: var(--accent); color: var(--ink); font-weight: 700; }
.steps li.done { border-color: var(--accent); }

.group-label { font-size: var(--t-small); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-top: var(--s3); }
.items { display: flex; flex-direction: column; gap: var(--s2); }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); display: flex; align-items: stretch; }
.item-main {
  flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: var(--s3);
  padding: var(--s2) var(--s3); background: none; border: 0; border-radius: var(--radius); text-align: left; justify-content: flex-start; font-weight: 400;
}
.thumb { width: 55px; height: 55px; flex: none; border-radius: var(--s2); background: var(--bg); object-fit: contain; display: grid; place-items: center; color: var(--muted); font-size: var(--t-small); }
.item-name { font-weight: 700; overflow-wrap: anywhere; }

.small.warn { color: var(--warn); font-weight: 600; }

.actionbar {
  position: sticky; bottom: 0; background: linear-gradient(to top, var(--bg) 70%, transparent);
  padding-block: var(--s3); padding-bottom: calc(var(--s3) + env(safe-area-inset-bottom, 0px));
  display: flex; gap: var(--s2);
}
.actionbar .primary { flex: 1.618 1 0; }

label { font-weight: 700; display: block; margin-bottom: var(--s1); }
input[type="text"], input[type="search"], input[type="date"], select, textarea {
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--muted); border-radius: var(--s2); min-height: 48px; padding: var(--s2) var(--s3); width: 100%;
}

.moods { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s2); }

.field-hint { font-size: var(--t-small); color: var(--muted); margin-top: var(--s1); }

.check { display: flex; gap: var(--s3); align-items: flex-start; font-weight: 700; }
.check input { width: 24px; height: 24px; flex: none; margin: 0; accent-color: var(--accent); }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s3); }
.two input[type="date"] { min-width: 0; padding-inline: var(--s2); }
.swatches { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s2); }
.swatch { position: relative; display: grid; gap: var(--s1); justify-items: center; padding: var(--s2); border: 1px solid var(--line); border-radius: var(--s2); font-size: var(--t-small); font-weight: 400; text-align: center; cursor: pointer; margin: 0; }
.swatch input { position: absolute; opacity: 0; pointer-events: none; }
.swatch .chip { width: 100%; aspect-ratio: 1.618; border-radius: var(--s1); border: 1px solid var(--line); }
.swatch:has(input:checked) { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); font-weight: 700; }
.swatch:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }

.notice { border-radius: var(--s2); padding: var(--s3); background: var(--accent-soft); }
.notice.warn { background: var(--warn-soft); color: var(--warn); }

dialog {
  border: 0; border-radius: var(--radius); padding: 0; background: var(--surface); color: var(--ink);
  width: min(560px, calc(100vw - 16px)); max-height: calc(100dvh - 34px);
}
dialog::backdrop { background: rgba(27, 36, 32, 0.55); }
.dlg-head { position: sticky; top: 0; background: var(--surface); display: flex; align-items: center; justify-content: space-between; gap: var(--s3); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); z-index: 1; }
.dlg-body { padding: var(--s4); display: flex; flex-direction: column; gap: var(--s4); }
.dlg-foot { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: var(--s3) var(--s4); display: flex; gap: var(--s2); flex-wrap: wrap; }
.dlg-foot .primary { flex: 1.618 1 0; }

.results { display: flex; flex-direction: column; gap: var(--s1); }
.result { justify-content: flex-start; text-align: left; font-weight: 400; gap: var(--s3); padding: var(--s2) var(--s3); }
.photo-box { display: grid; grid-template-columns: 38.2% 1fr; gap: var(--s3); align-items: center; }
.photo-box img, .photo-box .ph { width: 100%; aspect-ratio: 1; object-fit: contain; background: var(--bg); border-radius: var(--s2); display: grid; place-items: center; color: var(--muted); font-size: var(--t-small); text-align: center; padding: var(--s2); }

.check-row { display: grid; grid-template-columns: 1fr auto; gap: var(--s1) var(--s3); padding: var(--s3) 0; border-top: 1px solid var(--line); align-items: baseline; background: none; border-left: 0; border-right: 0; border-bottom: 0; border-radius: 0; width: 100%; text-align: left; font-weight: 400; min-height: 0; }
.check-row .hints { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: var(--s1); }

.strip { display: flex; gap: var(--s3); overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: var(--s2); }
.shot { flex: 0 0 min(72%, 300px); scroll-snap-align: start; display: flex; flex-direction: column; gap: var(--s2); }
.shot img { width: 100%; border: 1px solid var(--line); border-radius: var(--s2); background: var(--surface); }

/* Kopf der Werkstatt: am Handy Markt und „Mein Markt“ über der Woche, ab 900 px alles in einer Zeile. */
.boardhead { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "brand settings" "week week"; align-items: center; gap: var(--s3); }
.boardhead .brand { grid-area: brand; }
.boardhead .settings { grid-area: settings; }

@media (min-width: 900px) { .boardhead { grid-template-columns: 1fr auto 1fr; grid-template-areas: "brand week settings"; } .boardhead .settings { justify-self: end; } }
.weekbar { display: flex; align-items: center; justify-content: center; gap: var(--s4); }
.weekbar-title { text-align: center; }
.weekbar h1 { margin: 0; }

.labelbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s2) var(--s3); padding: 6px var(--s3); max-width: 760px; margin-inline: auto; width: 100%; font-size: var(--t-small); border-radius: var(--s2); background: #FFF6D6; border: 1px solid #F0D98A; }

.labelbar button { min-height: 40px; }

.help summary { cursor: pointer; }

.sheet canvas { display: block; width: 100%; height: auto; }

.motto-handle:hover, .motto-handle:focus-visible, .motto-handle.moving { border-color: var(--accent); background: rgba(255, 255, 255, 0.25); }

.motto-handle:hover .grip, .motto-handle:focus-visible .grip, .motto-handle.moving .grip { opacity: 1; }

.motto-handle .sw { left: -8px; bottom: -8px; cursor: nesw-resize; }
.bg-strength { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; padding: 4px 8px; }
.bg-strength input { flex: 1; min-height: 0; }
.band-library { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.band-pick { display: grid; gap: 4px; padding: 4px; min-height: 0; border: 2px solid var(--line); border-radius: 8px; background: var(--surface); font: 600 12px system-ui, sans-serif; text-align: left; }
.band-pick img { width: 100%; aspect-ratio: 3 / 1; object-fit: cover; border-radius: 5px; display: block; }
.band-pick.on { border-color: var(--accent); }
.share-wa { background: #25D366; color: #FFFFFF; border-color: #25D366; font-weight: 700; }
.share-fb { background: #1877F2; color: #FFFFFF; border-color: #1877F2; font-weight: 700; }
.share-ig { background: #C13584; color: #FFFFFF; border-color: #C13584; font-weight: 700; }
.share-btn { font-weight: 700; }
.own-color { display: inline-flex; align-items: center; gap: 6px; font: 600 12px system-ui, sans-serif; cursor: pointer; padding: 0 6px; border: 1px solid var(--line, #ccc); border-radius: 6px; }
.scale-handle { position: absolute; z-index: 2; pointer-events: none; border: 2px dashed transparent; border-radius: var(--s2); transform-origin: 0 0; }
.sheet:hover .scale-handle, .scale-handle.moving { border-color: var(--accent); }
.scale-handle .grip { position: absolute; width: 16px; height: 16px; background: var(--surface); border: 2px solid var(--accent); border-radius: 3px; pointer-events: auto; touch-action: none; }
.scale-handle .ne { right: -9px; top: -9px; cursor: nesw-resize; }
.scale-handle .nw { left: -9px; top: -9px; cursor: nwse-resize; }
.scale-handle .sw { left: -9px; bottom: -9px; cursor: nesw-resize; }
.scale-handle .se { right: -9px; bottom: -9px; cursor: nwse-resize; }
.scale-handle .scale-label { position: absolute; right: 6px; bottom: -26px; font: 600 12px system-ui, sans-serif; color: var(--accent); background: var(--surface); padding: 1px 6px; border-radius: 4px; opacity: 0; }
.sheet:hover .scale-handle .scale-label, .scale-handle.moving .scale-label { opacity: 1; }

.sheet:hover .scale-handle .scale-reset { opacity: 1; }
@media (hover: none) { .scale-handle .scale-reset { opacity: 1; } }
@media (hover: none) { .scale-handle { border-color: var(--accent); } .scale-handle .grip { width: 24px; height: 24px; } .scale-handle .ne { right: -13px; top: -13px; } .scale-handle .nw { left: -13px; top: -13px; } .scale-handle .sw { left: -13px; bottom: -13px; } .scale-handle .se { right: -13px; bottom: -13px; } }
.claim-handle.selected { border-color: var(--accent); background: rgba(15, 109, 92, 0.08); }
.claim-handle.selected .grip { opacity: 1; }
.claim-menu { display: flex !important; flex-direction: column; align-items: stretch; width: 360px; max-width: 92vw; white-space: normal; }
.claim-menu[hidden] { display: none !important; }
.claim-menu .ctx-title { width: 100%; }
.claim-menu .grp { display: grid; grid-template-columns: 56px repeat(4, 1fr); align-items: center; gap: 2px; padding: 3px 0; border-top: 1px solid var(--line); }
.claim-menu .grp > button { min-width: 0; }
.claim-menu .grp-name { width: 56px; flex: none; font: 700 11px system-ui, sans-serif; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.claim-menu > button.on { background: var(--accent-soft); color: var(--accent); }
.claim-edit { width: 100%; display: grid; gap: 6px; padding: 6px 4px 2px; border-top: 1px solid var(--line); }
.claim-edit[hidden] { display: none; }
.claim-edit textarea { width: 100%; min-height: 70px; font: 600 15px system-ui, sans-serif; }
.motto-handle .rot { left: 50%; top: -30px; margin-left: -8px; width: 16px; height: 16px; border-radius: 50%; cursor: grab; }
.motto-handle .rot::after { content: ''; position: absolute; left: 50%; top: 14px; width: 2px; height: 14px; margin-left: -1px; background: var(--accent); }
/* Handy: Rahmen und Griffe nur am angetippten Element; nicht gewählt scrollt der Finger einfach die Seite */
@media (hover: none) { .motto-handle { touch-action: pan-y; } .motto-handle .grip { width: 21px; height: 21px; pointer-events: none; }
  .motto-handle:hover, .motto-handle:focus-visible { border-color: transparent; background: transparent; } .motto-handle:hover .grip, .motto-handle:focus-visible .grip { opacity: 0; }
  .motto-handle.selected, .motto-handle.moving { border-color: var(--accent); touch-action: none; } .motto-handle.selected .grip, .motto-handle.moving .grip { opacity: 1; pointer-events: auto; }
  .motto-handle .rot { top: -40px; margin-left: -11px; width: 22px; height: 22px; } .motto-handle .rot::after { top: 20px; height: 18px; }
  .motto-handle .nw { left: -13px; top: -13px; } .motto-handle .se { right: -13px; bottom: -13px; } .motto-handle .ne { right: -13px; top: -13px; } .motto-handle .sw { left: -13px; bottom: -13px; } }
.ghost { position: fixed; left: 0; top: 0; z-index: 1000; pointer-events: none; width: 89px; height: 89px; margin: -44px 0 0 -44px; border-radius: var(--radius); background: var(--surface); box-shadow: 0 8px 21px rgba(0, 0, 0, 0.3); display: grid; place-items: center; overflow: hidden; }

@media (max-width: 560px) { .bench-filter { grid-template-columns: 1fr; } }
.bench-item { display: flex; align-items: center; justify-content: flex-start; gap: var(--s2); text-align: left; font-weight: 400; cursor: grab; touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
/* Buch: immer eine Seite sichtbar, Blättern mit Pfeilen, Wischen, Seitenpunkten oder Pfeiltasten.
   Das Umblättern dreht das Blatt um die linke Kante (wie im Buch), mit Papier-Rückseite und Schatten. */
.wrap.wide { overflow-x: clip; }
.book { position: relative; width: 100%; max-width: 640px; margin-inline: auto; perspective: 2600px; }
.book-stage { position: relative; transform-style: preserve-3d; }
.book-stage.zoomed { overflow: hidden; touch-action: none; border-radius: var(--s2); }
.zoom-reset { position: absolute; top: var(--s2); right: var(--s2); z-index: 7; min-height: 40px; padding: 0 var(--s3); font-size: var(--t-small);
  background: rgba(255, 255, 255, 0.94); box-shadow: 0 3px 13px rgba(27, 36, 32, 0.22); }
/* Am Computer: Lupe neben der Seite (Plus, Minus), dazu Strg + Mausrad. */

.zoom-tools button { width: 55px; min-height: 48px; padding: 0; font-size: 26px; line-height: 1; background: rgba(255, 255, 255, 0.94); box-shadow: 0 3px 13px rgba(27, 36, 32, 0.18); }
.zoom-tools button:disabled { opacity: 0.4; }
@media (pointer: coarse), (max-width: 820px) { .zoom-tools { display: none; } }
.book-stage > .muted { padding: var(--s6) 0; text-align: center; }
.flip-btn { position: absolute; top: 50%; transform: translateY(-50%); z-index: 6; width: 55px; height: 89px; padding: 0; font-size: 34px; line-height: 1;
  background: rgba(255, 255, 255, 0.94); box-shadow: 0 3px 13px rgba(27, 36, 32, 0.18); }
.flip-btn.prev { left: -76px; }
.flip-btn.next { right: -76px; }
.flip-btn:disabled { opacity: 0; pointer-events: none; }
.flip-btn.drop { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 3px var(--accent); }
@media (max-width: 800px) { .flip-btn { width: 30px; height: 60px; font-size: 24px; min-width: 0; background: rgba(255, 255, 255, 0.72); } .flip-btn.prev { left: 0; border-radius: 0 10px 10px 0; } .flip-btn.next { right: 0; border-radius: 10px 0 0 10px; } }

function el(tag, props, ...kids) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props || {})) {
    if (value === null || value === undefined || value === false) continue;
    if (key === 'class') node.className = value;
    else if (key === 'text') node.textContent = value;
    else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
    else if (value === true) node.setAttribute(key, '');
    else node.setAttribute(key, String(value));
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    node.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return node;
}
/** Entfernt leere Einträge, damit append/replaceChildren kein "null" als Text einfügt. */

const formatPrice = (cents) => euro.format(cents / 100);

/** Liest "1,99", "1.99" oder "2" und gibt Cent zurück; null bei ungültiger Eingabe. */
function parsePrice(text) {
  const cleaned = String(text || '').replace(/€/g, '').replace(/\s/g, '').replace(',', '.');
  if (!/^\d{1,4}(\.\d{1,2})?$/.test(cleaned)) return null;
  const cents = Math.round(parseFloat(cleaned) * 100);
  return cents > 0 ? cents : null;
}

/** Grundpreis je kg oder l aus Angaben wie "500 g", "6x1,5 l" oder "0,5 l zzgl. Pfand". */
function basePrice(inhalt, cents) {
  const text = String(inhalt || '').trim();
  if (text.includes('=')) return null;   // der Text nennt den Grundpreis schon
  const match = /^(?:(\d+)\s*x\s*)?(\d+(?:[.,]\d+)?)\s*(g|kg|ml|cl|l)(?![a-zäöü])/im.exec(text);
  if (!match || !cents) return null;
  const unit = match[3].toLowerCase();
  const factor = { g: 0.001, kg: 1, ml: 0.001, cl: 0.01, l: 1 }[unit];
  const amount = (match[1] ? Number(match[1]) : 1) * parseFloat(match[2].replace(',', '.')) * factor;
  if (!(amount > 0) || Math.abs(amount - 1) < 1e-9) return null;
  return `1 ${unit === 'g' || unit === 'kg' ? 'kg' : 'l'} = ${formatPrice(Math.round(cents / amount))} €`;
}

/* Datumsrechnung durchgehend in UTC, damit Zeitzonen keinen Tag verschieben. */
const toDate = (iso) => { const [y, m, d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const toIso = (date) => date.toISOString().slice(0, 10);
const addDays = (iso, days) => { const d = toDate(iso); d.setUTCDate(d.getUTCDate() + days); return toIso(d); };
function todayIso() { const n = new Date(); return toIso(new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()))); }
function mondayOf(iso) { const d = toDate(iso); return addDays(iso, -((d.getUTCDay() + 6) % 7)); }
function isoWeek(iso) {
  const d = toDate(iso);
  d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7) + 3);
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  return 1 + Math.round(((d - firstThursday) / 864e5 - 3 + ((firstThursday.getUTCDay() + 6) % 7)) / 7);
}
const shortDate = (iso) => { const [, m, d] = iso.split('-'); return `${d}.${m}.`; };
const longDate = (iso) => { const [y, m, d] = iso.split('-'); return `${d}.${m}.${y}`; };
const isIsoDate = (value) => /^\d{4}-\d{2}-\d{2}$/.test(value) && !Number.isNaN(toDate(value).getTime());

/* Rückgängig (Marco 15.10.): vor jeder gespeicherten Änderung merkt sich die Werkstatt den vorigen Stand der Woche. */
const history = { list: [], last: null };
function snapFlyer() {
  const f = typeof currentFlyer === 'function' ? currentFlyer() : null;
  return f ? { id: f.id, json: JSON.stringify(f) } : null;
}
function rememberStep() {
  const now = snapFlyer();
  if (!now) return;
  if (history.last && history.last.id === now.id && history.last.json !== now.json) {
    history.list.push(history.last);
    if (history.list.length > 40) history.list.shift();
  }
  history.last = now;
}
function undoStep() {
  const step = history.list.pop();
  if (!step) { toast('Nichts mehr zum Zurücknehmen.'); return; }
  const flyer = state.flyers.find((f) => f.id === step.id);
  if (!flyer) return;
  for (const key of Object.keys(flyer)) delete flyer[key];
  Object.assign(flyer, JSON.parse(step.json));
  history.last = step;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (error) { /* nur im Speicher */ }
  ui.sel = null;
  render();
  toast('Rückgängig gemacht.');
}

});

function weekDates(week) {
  const [d2, m2, year] = week.bis.split('.');
  const [d1, m1] = week.von.split('.');
  return { from: `${year}-${m1}-${d1}`, to: `${year}-${m2}-${d2}` };

/** Fügt getrennte Wörter wieder zusammen: "koffein- haltig" wird "koffeinhaltig", "Schlag- oder" bleibt. */
const mendHyphens = (text) => text.replace(/([a-zäöüß])- (?!oder |und )([a-zäöü])/g, '$1$2').replace(/- ([A-ZÄÖÜ])/g, '-$1');
/* Lange Lüning-Namen kürzen: Herkunftsländer wandern in den Text darunter (bei Obst und Gemüse Pflichtangabe),
   Aufzählungen enden nach dem ersten Produkt mit "u. a.". Der volle Name bleibt in langName erhalten. */
const COUNTRIES = ['Deutschland', 'Niederlande', 'Spanien', 'Italien', 'Portugal', 'Frankreich', 'Belgien', 'Polen', 'Österreich', 'Griechenland', 'Türkei',
  'Marokko', 'Ägypten', 'Israel', 'Südafrika', 'Neuseeland', 'Brasilien', 'Ecuador', 'Chile', 'Peru', 'Kolumbien', 'Costa Rica', 'Argentinien'];
const NAME_LIMIT = 30;
function shortenItem(item) {
  item.langName = item.name;
  const origin = new RegExp(`^((?:${COUNTRIES.join('|')})(?:/(?:${COUNTRIES.join('|')}))*)\\s+(.+)$`).exec(item.name);
  if (origin) {
    item.name = origin[2];
    item.inhalt = [origin[1], item.inhalt].filter(Boolean).join('\n');
  }
  if (item.name.length <= NAME_LIMIT) return item;
  const cuts = [', ', ' oder ', ' aus ', ' mit '].map((mark) => item.name.indexOf(mark)).filter((at) => at >= 8 && item.name[at - 1] !== '-');
  if (!cuts.length) return item;
  const at = Math.min(...cuts);
  const list = /^(, | oder )/.test(item.name.slice(at));
  item.name = `${item.name.slice(0, at)}${list ? ' u.\u00a0a.' : ''}`;   // geschütztes Leerzeichen: "u. a." bleibt zusammen
  return item;
}
function itemFromWeek(entry) {
  let inhalt = '';
  for (const line of entry.text || []) {

    inhalt += (inhalt ? (joins ? ' ' : '\n') : '') + line.trim();

  return shortenItem({ id: uid(), ean: null, name: mendHyphens(entry.name), inhalt: mendHyphens(inhalt), group: WEEK_GROUP, price: entry.preis, oldPrice: null, star: Boolean(entry.haupt), photo: null, bild: entry.bild || null, px: Math.max(entry.bw || 0, entry.bh || 0), lvp: null, ek: null, carried: false });

/** Der erste Artikel ist das Hauptangebot. Ein neu gewählter Stern rückt an die erste Stelle. */
function arrange(flyer) {
  const at = flyer.items.findIndex((item) => item.star);
  if (at > 0) flyer.items.unshift(flyer.items.splice(at, 1)[0]);
  flyer.items.forEach((item, i) => { item.star = i === 0; });
}
/** Setzt einen neuen Artikel auf den Platz eines anderen; der bisherige wandert in die Ablage. */
function placeItem(flyer, item, targetId) {
  const at = flyer.items.findIndex((i) => i.id === targetId);
  if (at < 0) return;
  if (at < slotCount(flyer)) { const old = flyer.items[at]; flyer.items[at] = item; flyer.items.push(old); }
  else flyer.items.splice(at, 0, item);
  flyer.items.forEach((entry, i) => { entry.star = i === 0; });
}
function swapItems(flyer, firstId, secondId) {
  const a = flyer.items.findIndex((i) => i.id === firstId);
  const b = flyer.items.findIndex((i) => i.id === secondId);
  if (a < 0 || b < 0 || a === b) return;
  [flyer.items[a], flyer.items[b]] = [flyer.items[b], flyer.items[a]];
  flyer.items.forEach((item, i) => { item.star = i === 0; });
}
function moveItem(flyer, itemId, step) {
  const from = flyer.items.findIndex((i) => i.id === itemId);
  const to = from + step;
  if (from < 0 || to < 0 || to >= flyer.items.length) return;

  if (item.ek && item.price < item.ek) hints.push({ warn: true, text: 'Unter dem Einkaufspreis' });
  if (item.lvp && item.price > item.lvp) hints.push({ warn: true, text: `Teurer als empfohlen (${formatPrice(item.lvp)} €)` });
  if (item.oldPrice && item.oldPrice <= item.price) hints.push({ warn: true, text: 'Alter Preis ist nicht höher' });

/* ---------- Bilder einlesen ---------- */
function pickFile(useCamera, accept = 'image/*') {
  return new Promise((resolve) => {
    const input = el('input', { type: 'file', accept, capture: useCamera ? 'environment' : null, hidden: true });
    input.addEventListener('change', () => { resolve(input.files[0] || null); input.remove(); });
    input.addEventListener('cancel', () => { resolve(null); input.remove(); });
    document.body.append(input);
    input.click();
  });
}
function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('Bild nicht lesbar'));
    img.src = src;
  });
}
/** Verkleinert ein Foto auf höchstens 1000 Pixel Kantenlänge und gibt es als JPEG zurück. */
async function fileToPhoto(file, maxSide = 1000) {
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImage(url);
    const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
    const canvas = el('canvas', { width: Math.round(img.naturalWidth * scale), height: Math.round(img.naturalHeight * scale) });
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    return { data: canvas.toDataURL('image/jpeg', 0.86), px: Math.min(canvas.width, canvas.height), source: img };
  } finally { URL.revokeObjectURL(url); }
}
async function readBarcode(file) {
  if (!('BarcodeDetector' in window)) return { supported: false, code: null };
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImage(url);
    const detector = new window.BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a'] });
    const found = await detector.detect(img);
    return { supported: true, code: found.length ? found[0].rawValue : null };
  } catch (error) {
    return { supported: true, code: null };
  } finally { URL.revokeObjectURL(url); }
}

/** Artikelfeld: Bild links (ragt oben über das Feld), Text rechts oben, Preisschild rechts unten.
    Bei "großen Bildern" bekommt das Bild gut die Hälfte der Breite (1 / PHI^1,25) und der Text wird knapp gehalten. */
function drawTile(ctx, x, y, w, h, item, settings, img, large = false) {
  // ctx.cardFill: Farbe der Karte, null = Produkt frei auf dem Grund (Markenband links/oben)
  // Jedes Angebot steht mit Bild, Bezeichnung und Preis in einem weißen Feld (Marco 15.10.)
  const card = ctx.cardFill || '#FFFFFF';
  if (card) {
    ctx.fillStyle = card;
    roundRect(ctx, x, y, w, h, Math.min(w, h) / PHI ** 5);
    ctx.fill();
  }
  if (large && img) {
    // Großes Feld: Produkt füllt gut 60 % der Breite und die volle Höhe, Text rechts oben, großes Preisschild rechts unten
    const pad = h / PHI ** 6;
    const lTagH = Math.min(w / PHI ** 2.9, h / PHI ** 1.55);
    const lTagW = lTagH * PHI;
    const lTagX = x + w - lTagW - pad * 0.6;
    const lTagY = y + h - lTagH - pad * 0.6;
    const imgW = w / PHI ** 0.85;
    drawProduct(ctx, img, item, x + pad * 0.5, y + pad, imgW, h - pad * 2, false);
    const textX = x + imgW + pad * 0.6;
    drawCopy(ctx, fitCopy(ctx, item, x + w - pad - textX, lTagY - y - pad * 1.4, Math.min(h / PHI ** 4.6, w / 15), true), textX, y + pad);
    drawTag(ctx, lTagX, lTagY, lTagW, lTagH, item, settings);
    const r = h / PHI ** 3.6;
    drawBurst(ctx, x + r * 0.8, y + r * 0.8, r, burstText(item), settings);
    return;
  }
  const pad = h / PHI ** 6;
  const wide = w > h * 2;
  // Schmale Produkte (Flaschen, Dosen) bekommen eine schmalere Bildspalte, der Text gewinnt die Breite.
  const aspect = img ? img.naturalWidth / img.naturalHeight : 1;
  const big = settings.bilder === 'gross' && !wide;
  const tagH = Math.min(w / PHI ** 3, h / PHI ** 1.5);
  const tagW = tagH * PHI;
  const tagX = x + w - tagW - pad * 0.6;
  const tagY = y + h - tagH - pad * 0.6;
  const nameSize = Math.min(h / PHI ** 5, w / 14);
  if (img && aspect < 1.7 && !wide && h > w * 0.85) {
    // Hohe Felder: Text oben über die ganze Breite, Produkt groß darunter bis zum Preisschild
    const plan = fitCopy(ctx, item, w - pad * 2, h / PHI ** 2.6, nameSize, true);
    drawCopy(ctx, plan, x + pad, y + pad);
    const imgTop = y + pad * 1.6 + plan.height;
    drawProduct(ctx, img, item, x + pad * 0.5, imgTop, w - tagW * 0.45 - pad, y + h - imgTop - pad * 0.4, false);
    drawTag(ctx, tagX, tagY, tagW, tagH, item, settings);
    const burstT = h / PHI ** 4.2;
    drawBurst(ctx, x + w - burstT * 0.9, y + burstT * 0.9, burstT, burstText(item), settings);
    return;
  }
  if (img && aspect >= 1.7 && !wide) {
    // Breite, flache Produkte (Gurken, Paletten): Text oben über die ganze Breite, Bild füllt unten links bis zum Preis
    const plan = fitCopy(ctx, item, w - pad * 2, h / PHI ** 2.2, nameSize, true);
    drawCopy(ctx, plan, x + pad, y + pad);
    const imgTop = y + pad * 1.4 + plan.height;
    // Zwei mögliche Flächen: links neben dem Preisschild (volle Höhe) oder über dem Preisschild (volle Breite) – die größere gewinnt
    const besideW = tagX - x - pad;
    const besideH = y + h - imgTop - pad * 0.4;
    const aboveW = w - pad;
    const aboveH = tagY - imgTop - pad * 0.3;
    const fit = (bw, bh) => Math.min(bw / img.naturalWidth, bh / img.naturalHeight);
    if (aboveH > 0 && fit(aboveW, aboveH) > fit(besideW, besideH)) drawProduct(ctx, img, item, x + pad * 0.5, imgTop, aboveW, aboveH, false);
    else drawProduct(ctx, img, item, x + pad * 0.5, imgTop, besideW, besideH, false);
    drawTag(ctx, tagX, tagY, tagW, tagH, item, settings);
    const burstR0 = h / PHI ** 3.9;
    drawBurst(ctx, x + w - burstR0 * 0.9, y + burstR0 * 0.9, burstR0, burstText(item), settings);
    return;
  }
  const imageW = wide ? w / PHI ** 2 : big ? w / PHI ** 1.25 : Math.min(w / PHI ** 1.7, Math.max(w / PHI ** 2.6, h * aspect * 0.92 + pad));
  if (isCutout(item)) drawProduct(ctx, img, item, x + pad * 0.4, y + pad * 0.6, imageW - pad * 0.4, h - pad * 1.2, false);
  else drawProduct(ctx, img, item, x + pad, y + pad, imageW - pad * 1.5, h - pad * 2, false);
  const textX = x + imageW + pad * 0.4;
  drawCopy(ctx, fitCopy(ctx, item, x + w - pad - textX, tagY - y - pad * 1.4, nameSize, big), textX, y + pad);
  drawTag(ctx, tagX, tagY, tagW, tagH, item, settings);
  const burstR = h / PHI ** 3.9;
  drawBurst(ctx, x + burstR * 0.8, y + burstR * 0.8, burstR, burstText(item), settings);
}
function drawValidity(ctx, flyer, x, y, size, align) {
  ctx.save();
  ctx.shadowColor = 'rgba(255,255,255,0.95)';
  ctx.shadowBlur = size / 2;
  ctx.fillStyle = '#1B2420';
  ctx.textAlign = align;
  ctx.font = textFont(size, 600);
  ctx.fillText(`Gültig ${flyerTitle(flyer)} • von ${shortDate(flyer.from)} - ${longDate(flyer.to)}`, x, y);
  ctx.font = textFont(size, 400);
  ctx.fillText('Für Druckfehler keine Haftung.', x, y + size * 1.25);
  ctx.restore();
}
/** Kopf mit Stimmungsbild, Logo, Hauptangebot und (auf der Seite) dem zweiten Artikel unten links. */
function drawHero(ctx, size, heroH, margin, flyer, settings, images, main, side, slots) {
  const kopf = images.get('kopf');
  if (kopf) drawCover(ctx, kopf, 0, 0, size.w, heroH);
  else {
    const fill = ctx.createLinearGradient(0, 0, 0, heroH);
    fill.addColorStop(0, tint(settings.farbeKopf, 0.8));
    fill.addColorStop(1, tint(settings.farbeKopf, 0.3));
    ctx.fillStyle = fill;
    ctx.fillRect(0, 0, size.w, heroH);
  }
  const tall = heroH > size.w * 0.8;
  const logoH = size.w / PHI ** 5.3;
  drawLogo(ctx, margin, margin, logoH, settings, images.get('logo'));
  const small = logoH / PHI ** 3;
  const noteY = margin + logoH + small * 1.6;
  drawValidity(ctx, flyer, margin * 1.2, noteY, small, 'left');
  const copyTop = noteY + small * 1.9;
  const leftW = size.w / PHI ** 2;
  const mainImg = images.get(main.id);
  let tagW; let tagX; let tagY; let panelX; let panelY; let panelW; let panelMax; let nameSize;
  if (tall) {
    tagW = size.w / PHI ** 2 - margin;
    tagX = size.w - margin - tagW;
    tagY = heroH - tagW / PHI - margin;
    nameSize = size.w / 26;
    panelW = size.w / PHI - margin * 1.6;
    panelMax = nameSize * 7.2;
    panelX = margin;
    panelY = heroH - margin - panelMax;
    drawProduct(ctx, mainImg, main, margin * 2, copyTop, size.w - margin * 4, panelY - copyTop - margin, true);
    drawBurst(ctx, margin * 2 + size.w / 9, copyTop + size.w / 8, size.w / 9, burstText(main), settings);
  } else {
    tagW = size.w / PHI ** 3;
    tagX = size.w - margin - tagW;
    tagY = heroH - tagW / PHI - margin * 0.7;
    nameSize = size.w / 44;
    panelX = margin;
    panelY = copyTop;
    panelW = leftW - margin * 1.6;
    const sideH = side ? (leftW - margin * 1.2) / PHI ** 1.45 : 0;
    const sideY = heroH - sideH - margin * 0.7;
    panelMax = (side ? sideY - margin * 0.5 : heroH - margin) - panelY;
    drawProduct(ctx, mainImg, main, leftW - margin * 0.6, margin * 0.7, size.w - leftW - margin * 0.6, heroH - margin * 1.3, true);
    drawBurst(ctx, leftW + heroH / 9, margin + heroH / 5, heroH / PHI ** 4.3, burstText(main), settings);
    slots.push({ id: main.id, x: leftW, y: 0, w: size.w - leftW, h: heroH });
    if (side) {
      drawTile(ctx, margin, sideY, leftW - margin * 1.2, sideH, side, settings, images.get(side.id));
      slots.push({ id: side.id, x: margin, y: sideY, w: leftW - margin * 1.2, h: sideH });
    }
  }
  // Textfeld des Hauptangebots: erst setzen, dann die Fläche genau so hoch zeichnen
  const inner = nameSize * 0.55;
  const plan = fitCopy(ctx, main, panelW - inner * 2, panelMax - inner * 2, nameSize);
  const panelH = plan.height + inner * 2;
  const top = tall ? heroH - margin - panelH : panelY;
  ctx.fillStyle = 'rgba(255,255,255,0.82)';
  roundRect(ctx, panelX, top, panelW, panelH, nameSize / 2);
  ctx.fill();
  drawCopy(ctx, plan, panelX + inner, top + inner);
  drawTag(ctx, tagX, tagY, tagW, tagW / PHI, main, settings);
}
/** Motto (Überschrift) in Schreibschrift. Es wird als Letztes gezeichnet und liegt damit immer über allem.
    Der Platz ist frei wählbar: mottoPos nennt die Mitte als Anteil der Seitenbreite und -höhe. */
const MOTTO_HOME = { x: 0.7, y: 0.045 };
const MOTTO_SCALE = { min: 0.4, max: 3 };
const mottoScale = (flyer) => Math.min(MOTTO_SCALE.max, Math.max(MOTTO_SCALE.min, Number(flyer.mottoScale) || 1));
function drawMotto(ctx, size, flyer, settings, free) {
  const text = mottoOf(flyer);
  if (!text) return null;
  const scale = free ? mottoScale(flyer) : 1;
  const fontSize = fitText(ctx, text, scriptFont, (size.w / PHI ** 6.1) * scale, free ? size.w - 16 : size.w * 0.52, 14);
  // Schreibschrift ragt über die Laufweite hinaus (Schwünge, farbiger Rand): echte Zeichenbreite messen.
  const m = ctx.measureText(text);
  const width = Math.max(m.width, (m.actualBoundingBoxLeft || 0) + (m.actualBoundingBoxRight || 0)) + fontSize / 6;
  const pos = free && flyer.mottoPos ? flyer.mottoPos : MOTTO_HOME;
  const cx = Math.min(size.w - width / 2 - 4, Math.max(width / 2 + 4, pos.x * size.w));
  const cy = Math.min(size.h - fontSize * 0.7, Math.max(fontSize * 0.7, pos.y * size.h));
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.6)';
  ctx.shadowBlur = fontSize / 4.5;
  ctx.shadowOffsetY = fontSize / 16;
  ctx.textAlign = 'center';
  ctx.lineJoin = 'round';
  ctx.lineWidth = fontSize / 6;
  ctx.strokeStyle = settings.farbePreis;      // farbiger Rand: lesbar auf jedem Untergrund
  ctx.strokeText(text, cx, cy + fontSize * 0.33);
  ctx.shadowColor = 'transparent';
  ctx.fillStyle = '#FFFFFF';
  ctx.fillText(text, cx, cy + fontSize * 0.33);
  ctx.restore();
  return { x: cx - width / 2, y: cy - fontSize * 0.65, w: width, h: fontSize * 1.3 };
}
/** Fußleiste der Innenseiten im Stil der Partnerleiste: volle Breite in der Preisfarbe, links groß der Zusatz
    (z. B. „Rund um die Uhr geöffnet“) in Großbuchstaben, rechts klein Markt, Gültigkeit, Seite und Abgabehinweis. */
function drawOpenBar(ctx, size, y, h, margin, flyer, settings, page, pages, images) {
  ctx.fillStyle = settings.farbePreis;
  ctx.fillRect(0, y, size.w, h);
  const left = margin * 0.75;
  const right = size.w - margin * 0.75;
  const claim = 'IMMER GEÖFFNET';   // Marco 15.10. (vorher „Rund um die Uhr geöffnet“)
  ctx.save();
  ctx.fillStyle = '#FFFFFF';
  ctx.textAlign = 'left';
  const big = fitText(ctx, claim, (s) => textFont(s, 900), h / PHI ** 1.4, size.w / PHI ** 1.6, 12);
  ctx.fillText(claim, left, y + h / 2 + big * 0.36);
  const claimW = ctx.measureText(claim).width;
  ctx.restore();
  // Rechts das Logo auf gelbem Feld (wie in der Titelseite), links daneben klein Gültigkeit und Abgabehinweis
  const logoW = h / PHI ** 1.45 * 3;   // Logofeld ist ein Drittel so hoch wie breit
  const logoX = right - logoW;
  drawLogoPanel(ctx, logoX, y + (h - logoW / 3) / 2, logoW, settings, images);
  ctx.save();
  ctx.fillStyle = '#FFFFFF';
  ctx.textAlign = 'right';
  const lines = [`Gültig vom ${flyerRange(flyer)}`, 'Abgabe nur in haushaltsüblichen Mengen,', 'solange der Vorrat reicht!'];
  const room = logoX - margin * 0.8 - (left + claimW + margin);
  // Eine gemeinsame Schriftgröße, mit der alle Zeilen passen
  const small = Math.min(...lines.map((line, i) => fitText(ctx, line, (z) => textFont(z, i === 0 ? 700 : 400), h / PHI ** 4.3, room, 8)));
  const lead = small * 1.3;
  lines.forEach((line, i) => {
    ctx.font = textFont(small, i === 0 ? 700 : 400);
    ctx.fillText(line, logoX - margin * 0.8, y + h / 2 + (i - (lines.length - 1) / 2) * lead + small * 0.36);
  });
  ctx.restore();
}
/** WhatsApp- und Facebook-Zeichen, vereinfacht nachgezeichnet (runde Marke, weißes Symbol). */
function drawWhatsApp(ctx, cx, cy, r) {
  ctx.save();
  ctx.fillStyle = '#25D366';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#FFFFFF'; ctx.fillStyle = '#FFFFFF';
  ctx.lineWidth = r * 0.11;
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.58, Math.PI * 0.78, Math.PI * 2.62); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - r * 0.47, cy + r * 0.3); ctx.lineTo(cx - r * 0.62, cy + r * 0.66); ctx.lineTo(cx - r * 0.22, cy + r * 0.55); ctx.closePath(); ctx.fill();
  ctx.lineWidth = r * 0.17; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(cx + r * 0.08, cy - r * 0.08, r * 0.25, Math.PI * 0.55, Math.PI * 1.2); ctx.stroke();
  ctx.restore();
}
function drawFacebook(ctx, cx, cy, r) {
  ctx.save();
  ctx.fillStyle = '#1877F2';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.clip();
  ctx.fillStyle = '#FFFFFF';
  ctx.textAlign = 'center';
  ctx.font = `bold ${Math.round(r * 1.7)}px Arial, Helvetica, sans-serif`;
  ctx.fillText('f', cx + r * 0.12, cy + r * 0.95);
  ctx.restore();
}
/** Fußleiste „Folge uns“: links groß der Aufruf, dann WhatsApp und Facebook mit Zeichen, rechts der QR-Code

function drawSocialBar(ctx, size, y, h, margin, settings, images, hint) {
  // Gelbe Leiste mit roter Schrift (Marco 15.10.)
  ctx.fillStyle = settings.farbeKopf;
  ctx.fillRect(0, y, size.w, h);
  const ink = settings.farbePreis;
  const left = margin * 0.75;
  const right = size.w - margin * 0.75;
  ctx.save();
  ctx.fillStyle = ink;
  ctx.textAlign = 'left';
  const big = fitText(ctx, 'FOLGE UNS AUF', (s) => textFont(s, 900), h / PHI ** 2, size.w / PHI ** 2.2, 12);
  const cy = y + h / 2;
  ctx.fillText('FOLGE UNS AUF', left, cy + big * 0.36);
  let x = left + ctx.measureText('FOLGE UNS AUF').width + margin;
  const r = h / PHI ** 2.5;
  const label = h / PHI ** 3.2;
  ctx.font = textFont(label, 700);
  drawWhatsApp(ctx, x + r, cy, r);
  ctx.fillText('WhatsApp', x + r * 2 + margin * 0.35, cy + label * 0.36);
  x += r * 2 + margin * 0.35 + ctx.measureText('WhatsApp').width + margin * 0.9;

  ctx.fillText('Facebook', x + r * 2 + margin * 0.35, cy + label * 0.36);

  const qs = h - margin * 0.5;
  const qx = right - qs;
  const qy = y + (h - qs) / 2;
  const qr = images.get('qr');

    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(qx, qy, qs, qs);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(qr, qx, qy, qs, qs);
    ctx.imageSmoothingEnabled = true;
    ctx.fillStyle = ink;
    // Kurzer Hinweis links neben dem Code, nur wenn Platz ist
    ctx.textAlign = 'right';
    ctx.font = textFont(label * 0.8, 700);
    if (qx - margin * 0.4 - ctx.measureText('scannen!').width > x + r * 2 + margin * 0.35 + ctx.measureText('Facebook').width * 1.25 + margin * 0.5) {
      ctx.fillText('Jetzt', qx - margin * 0.4, cy - label * 0.15);
      ctx.fillText('scannen!', qx - margin * 0.4, cy + label * 0.85);
    }

    ctx.strokeStyle = ink;
    ctx.fillStyle = ink;
    ctx.setLineDash([qs / 14, qs / 18]);
    ctx.lineWidth = 2;
    ctx.strokeRect(qx, qy, qs, qs);
    ctx.textAlign = 'center';
    ctx.font = textFont(qs / 8.5, 700);

  }
  ctx.restore();
}
function drawLegalBar(ctx, size, y, h, margin, flyer, settings, page, pages) {
  ctx.fillStyle = settings.farbePreis;

  ctx.fill();

  fitText(ctx, 'Abgabe nur in haushaltsüblichen Mengen, solange der Vorrat reicht!', (s) => textFont(s, 400), fontSize * 0.86, size.w * 0.55, 9);

/** Verteilt Felder nach einem Layout (Reihen mit Gewichten) in die Fläche. Das erste Angebot bekommt das größte Feld,
    gleich große Felder werden in Leserichtung (Z-Muster) gefüllt. Mit band zeigt die erste Reihe die Person. */
function drawRows(ctx, rows, items, x, top, w, bottom, gap, settings, images, slots, band, flyer, full = rows, grow = PHI ** 0.5) {
  const total = rows.reduce((sum, row) => sum + row.w, 0);
  const avail = bottom - top - gap * (rows.length - 1);
  // Teilseiten (wenige Angebote): Reihen nicht über die ganze Seite strecken, höchstens gut ein Viertel höher
  // als auf einer vollen Seite (PHI^0,5). Der Rest der Seite bleibt frei.
  const fullTotal = full.reduce((sum, row) => sum + row.w, 0);
  const fullAvail = bottom - top - gap * (full.length - 1);
  const unit = Math.min(avail / total, (fullAvail / fullTotal) * grow);
  const boxes = [];
  let y = top;
  rows.forEach((row, r) => {
    const h = unit * row.w;
    if (row.recipe) { drawRecipeBand(ctx, x, y, w, h, flyer, settings, images); slots.recipeBox = { x, y, w, h }; y += h + gap; return; }
    if (row.breaker) { slots.bandText = drawBreakerBand(ctx, x, y, w, h, images.get(`band_${row.breaker}`) || images.get('kopf'), settings, flyer, row.breaker); slots.breakerBox = { x, y, w, h, page: row.breaker, img: images.get(`band_${row.breaker}`) || images.get('kopf') }; y += h + gap; return; }
    if (band && r === 0) { drawPersonBand(ctx, x, y, w, h, images.get('person'), settings, flyer); y += h + gap; return; }
    const sum = row.cols.reduce((s, c) => s + c, 0);
    const cw = w - gap * (row.cols.length - 1);
    let bx = x;
    row.cols.forEach((c) => { const bw = cw * c / sum; boxes.push({ x: bx, y, w: bw, h, order: boxes.length }); bx += bw + gap; });
    y += h + gap;
  });
  const ranked = [...boxes].sort((p, q) => { const d = q.w * q.h - p.w * p.h; return Math.abs(d) > 1 ? d : p.order - q.order; });
  // Große Felder (deutlich größer als das kleinste Feld der Seite) zeigen das Produkt groß
  const smallest = Math.min(...boxes.map((b) => b.w * b.h));
  items.forEach((item, i) => {
    const box = ranked[i];
    if (!box) return;
    drawTile(ctx, box.x, box.y, box.w, box.h, item, settings, images.get(item.id), box.w * box.h > smallest * 1.4);
    slots.push({ id: item.id, x: box.x, y: box.y, w: box.w, h: box.h });
  });
}
/** Kopf einer Themenwelt: Band in der Kopffarbe, Überschrift in der Preisfarbe, rechts optional ein Stimmungsbild. */

  const last = lines.length - 1;
  const grow = big ? PHI : 1;
  ctx.save();
  ctx.font = textFont(100, weight);
  const at100 = lines.map((line, i) => ctx.measureText(line).width * (i === last ? grow : 1));
  // Ohne eigene Größe passt der Spruch in die Breite des Hauptangebots
  const room = size.w / PHI ** 1.6;
  const z = Math.min(size.w / PHI ** 6.2, room / Math.max(...at100) * 100) * claimScale(flyer);
  const align = claimAlignOf(flyer);
  const w = Math.max(...at100) * z / 100;
  // Blocksatz: jede Zeile genau so breit wie die breiteste (Schrift wird je Zeile angepasst)
  const sizes = lines.map((line, i) => z * (i === last ? grow : 1) * (align === 'block' ? Math.max(...at100) / at100[i] : 1));
  const h = sizes.reduce((sum, v) => sum + v * 0.92, 0);
  const pad = z / 2.6;
  const pos = flyer.claimPos || claimHome();
  // Immer ganz auf der Seite (mit Randabstand), auch wenn der Platz am Hauptangebot zu weit rechts liegt
  const edge = size.w / PHI ** 7 + pad;
  const cx = Math.min(size.w - edge - w / 2, Math.max(edge + w / 2, pos.x * size.w));
  const cy = Math.min(size.h - edge - h / 2, Math.max(edge + h / 2, pos.y * size.h));
  const rot = claimRot(flyer);
  ctx.translate(cx, cy);
  ctx.rotate(rot * Math.PI / 180);
  ctx.textAlign = align === 'left' ? 'left' : align === 'right' ? 'right' : 'center';
  const lx = align === 'left' ? -w / 2 : align === 'right' ? w / 2 : 0;
  ctx.lineJoin = 'round';
  let y = -h / 2;
  const base = sizes.map((v) => { y += v * 0.92; return y - v * 0.14; });
  const paint = (stroke) => lines.forEach((line, i) => {
    ctx.font = textFont(sizes[i], weight);
    if (stroke) { ctx.lineWidth = Math.min(sizes[i], z * PHI) / 3.2; ctx.strokeText(line, lx, base[i]); } else ctx.fillText(line, lx, base[i]);
  });
  ctx.shadowColor = 'rgba(0,0,0,0.3)';
  ctx.shadowBlur = z / 5;
  ctx.shadowOffsetY = z / 14;
  ctx.strokeStyle = settings.farbeKopf;
  if (outline) paint(true);
  ctx.shadowColor = 'transparent';
  ctx.fillStyle = '#111111';
  paint(false);
  ctx.restore();
  return { x: cx - w / 2 - pad, y: cy - h / 2 - pad, w: w + pad * 2, h: h + pad * 2, rot, home };
}
/** Hauptangebot mit Name und Text darüber (wie bei Netto/Edeka): erst der Text, darunter Produkt und Preisschild. */
function drawMainStack(ctx, x, y, w, h, main, settings, images, slots, nameSize) {

  const pad = Math.min(w, h) / PHI ** 5;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.25)';
  ctx.shadowBlur = pad;
  ctx.shadowOffsetY = pad / 3;
  ctx.fillStyle = '#FFFFFF';
  roundRect(ctx, x, y, w, h, pad);
  ctx.fill();
  ctx.restore();
  const ix = x + pad; const iy = y + pad; const iw = w - pad * 2; const ih = h - pad * 2;
  const plan = fitCopy(ctx, main, iw / PHI ** 0.5, ih / PHI ** 3, nameSize);
  drawCopy(ctx, plan, ix, iy);
  const by = iy + plan.height + nameSize / 2;
  drawMainFree(ctx, ix, by, iw, iy + ih - by, main, settings, images.get(main.id), true, false);

}
/** Logo auf einem Feld in der Kopffarbe (das iO-Logo ist selbst rot und verschwände sonst im Band). */
function drawLogoPanel(ctx, x, y, w, settings, images) {
  const pad = w / PHI ** 6;
  const img = images.get('logo');
  const logoH = img ? (w - pad * 2) * img.naturalHeight / img.naturalWidth : (w - pad * 2) / 4;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.25)';
  ctx.shadowBlur = pad * 2;
  ctx.fillStyle = settings.farbeKopf;
  ctx.fillRect(x, y, w, logoH + pad * 2);
  ctx.restore();

  return logoH + pad * 2;

/* Farben fürs Markenband: Markenfarben, Dunkel, Grün, Blau, Weiß – oder frei gewählt (flyer.bandColor). */
const bandColorOf = (flyer, settings) => (/^#[0-9a-f]{6}$/i.test(flyer.bandColor || '') ? flyer.bandColor : settings.farbePreis);
/** Leiste „Markenband“: Klick auf eine freie Stelle im Band. */
function bandMenu(canvas, flyer, figure) {
  const box = canvas.slots.bandBox;

  const keep = (change) => () => { change(); saveState(); ui.sel = 'band'; render(); };
  const now = bandColorOf(flyer, state.settings).toUpperCase();
  const colors = [[state.settings.farbePreis, 'Markenrot'], [state.settings.farbeKopf, 'Markengelb'], ['#1B2420', 'Dunkel'], ['#2E7D32', 'Grün'], ['#1E5AA8', 'Blau'], ['#FFFFFF', 'Weiß']];
  const free = el('input', { type: 'color', value: now.length === 7 ? now.toLowerCase() : '#c0175d', title: 'Eigene Farbe', 'aria-label': 'Eigene Farbe' });

    style: `left:${pct(box.x, canvas.width)};top:${pct(box.y, canvas.height)};width:${pct(box.w, canvas.width)};height:${pct(box.h, canvas.height)}` });

    style: `left:${pct(box.x + box.w / 2, canvas.width)};top:${pct(box.h * 0.4, canvas.height)}` },
    el('span', { class: 'ctx-title', text: 'Markenband' }),
    el('div', { class: 'veil-colors' },
      ...colors.map(([c, name]) => el('button', { type: 'button', class: `veil-swatch${now === c.toUpperCase() ? ' on' : ''}`, title: name, 'aria-label': name, style: `background:${c}`,
        onclick: keep(() => { if (c.toUpperCase() === state.settings.farbePreis.toUpperCase()) delete flyer.bandColor; else flyer.bandColor = c; }) })),
      el('label', { class: 'own-color', title: 'Eigene Farbe wählen' }, free, el('span', { text: 'Eigene Farbe' }))));

/** Markenband links (wie Netto): rotes Band über die ganze Höhe, oben Logo, Ort und Gültigkeit, darunter 3 Angebote
    in Weiß; rechts auf Gelb der Slogan, das Hauptangebot groß und 4 Felder. Bandbreite 1 / PHI^2 der Seite. */
function drawCoverLeft(ctx, size, margin, gap, flyer, settings, images, main, tiles, slots, bottom) {
  const bandW = Math.round(size.w / PHI ** 2);
  const end = bottom + gap;
  const ground = paintArea(ctx, bandW, 0, size.w - bandW, end, flyer, settings, images, settings.farbeKopf, SHEET, true);
  // Foto oder Textur als Hintergrund: die rechte Fläche ist ein Bildfeld (ziehen verschiebt, Zoom über die Leiste)
  const backdrop = flyer.hintergrund === 'foto' ? images.get(personPage(flyer) === 1 ? 'person' : 'kopf') : flyer.hintergrund && textureOf(settings) ? images.get(`textur_${settings.hintergrund}`) : null;
  if (backdrop) slots.stage = { x: bandW, y: 0, w: size.w - bandW, h: end, photo: backdrop, mirror: Boolean(flyer.stageMirror) };
  // Farbe des Markenbandes wählbar (Marco 15.10.), die Schrift passt sich an: hell auf dunklem, dunkel auf hellem Band
  const band = bandColorOf(flyer, settings);
  const light = isLight(band);
  const bandInk = light ? '#1B2420' : '#FFFFFF';
  const sloganInk = light ? settings.farbePreis : band.toUpperCase() === settings.farbeKopf.toUpperCase() ? settings.farbePreis : settings.farbeKopf;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.3)';
  ctx.shadowBlur = margin;
  ctx.fillStyle = band;
  ctx.fillRect(0, 0, bandW, end);
  ctx.restore();
  slots.bandBox = { x: 0, y: 0, w: bandW, h: end };
  // Kopf des Bandes: Logo, Ort groß, Gültigkeit auf einem dunkleren Streifen
  const inner = bandW - margin * 2;
  let y = margin;
  y += drawLogoPanel(ctx, margin, y, inner, settings, images) + gap * 1.6;
  const place = ortOf(settings) || settings.marktName;
  ctx.save();
  ctx.fillStyle = bandInk;
  ctx.textAlign = 'left';
  // Logo, Ort und Slogan schließen links und rechts bündig ab (Marco 15.10.): Schrift genau auf die Logobreite
  const fullWidth = (text, weight) => { ctx.font = textFont(100, weight); const m = ctx.measureText(text); return 100 * inner / (m.actualBoundingBoxLeft + m.actualBoundingBoxRight); };
  const flush = (text, z, weight) => { ctx.font = textFont(z, weight); ctx.fillText(text, margin + ctx.measureText(text).actualBoundingBoxLeft, y); };
  const big = fullWidth(place, 900);
  y += big * 0.78;
  flush(place, big, 900);
  const bandSlogan = String(settings.slogan || '').trim();
  if (bandSlogan) {
    const small = fullWidth(bandSlogan, 900);
    y += small * 0.98;
    ctx.fillStyle = sloganInk;
    flush(bandSlogan, small, 900);
    ctx.fillStyle = bandInk;
  }
  const range = `${flyerTitle(flyer)} · ${shortDate(flyer.from)} – ${longDate(flyer.to)}`;
  const dateSize = fitText(ctx, range, (s) => textFont(s, 700), size.w / PHI ** 7.3, inner - margin, 9);
  y += gap * 1.6;
  ctx.fillStyle = light ? 'rgba(0,0,0,0.08)' : 'rgba(0,0,0,0.18)';
  ctx.fillRect(0, y, bandW, dateSize * 2.2);
  ctx.fillStyle = bandInk;
  ctx.fillText(range, margin, y + dateSize * 1.45);
  y += dateSize * 2.2 + gap * 2;
  ctx.restore();
  // 4 Angebote im Band, untereinander (wie bei Netto)
  const bandRows = [{ w: 1, cols: [1] }, { w: 1, cols: [1] }, { w: 1, cols: [1] }, { w: 1, cols: [1] }];
  withInk(ctx, {}, () => drawRows(ctx, bandRows, tiles.slice(0, 4), margin, y, inner, end - margin, gap * 2, settings, images, slots, false, flyer));
  // Rechte Seite ohne Bild (Marco 15.10.: Bilder erst weiter hinten, wie bei Lüning): Hauptangebot oben, 2 × 2 Felder
  const x0 = bandW + margin * 1.4;
  const w = size.w - margin - x0;
  let ry = margin;
  const headline = mottoOf(flyer);
  ctx.save();
  ctx.textAlign = 'left';
  if (headline) {
    ctx.fillStyle = isLight(ground) ? '#1B2420' : '#FFFFFF';
    const s = fitText(ctx, headline, (z) => textFont(z, 700), size.w / PHI ** 6.2, w, 10);
    ry += s * 1.1;
    ctx.fillText(headline, x0, ry);
    ry += s * 0.3;
  }
  ctx.restore();
  const restRows = [{ w: 1, cols: [1, 1] }, { w: 1, cols: [1, 1] }];
  // Hauptangebot bekommt 61,8 % der Höhe, die 2 × 2 Felder den Rest
  const gridH = (end - margin - ry) / PHI ** 2;
  const mainBottom = end - margin - gridH - gap * 2;
  // Hauptangebot vom Anwender skalierbar (Ecken ziehen); die übrigen Felder bleiben, wo sie sind
  const ms = mainScaleOf(flyer);
  const mainTop = ry + gap * 1.6;
  const cardH = (mainBottom - mainTop) * ms;
  // Frei verschoben? (Hauptangebot ziehen) – Position der oberen linken Ecke, sonst der Platz im Layout
  const mp = null;   // fester Platz (Marco 15.10.), frühere Verschiebungen gelten nicht mehr
  // Grundplatz (Marco 15.10.): rechts unten in der Fläche, direkt über den 4 Feldern
  const mx = mp ? Math.min(size.w - margin - w * ms, Math.max(margin, mp.x * size.w)) : x0 + w - w * ms;
  const my = mp ? Math.min(end - margin - cardH, Math.max(margin, mp.y * size.h)) : mainBottom - cardH;
  // Erst die Felder, dann das Hauptangebot: frei verschoben liegt es immer obenauf
  withInk(ctx, {}, () => drawRows(ctx, restRows, tiles.slice(4, 8), x0, mainBottom + gap * 2, w, end - margin, gap * 2, settings, images, slots, false, flyer));
  if (main) {
    withInk(ctx, {}, () => drawMainStack(ctx, mx, my, w * ms, cardH, main, settings, images, slots, size.w / 42 * Math.max(0.75, ms)));
    slots.mainBox = { x: mx, y: my, w: w * ms, h: cardH, scale: ms, id: main.id };
  }
}
/** Markenband oben (wie Edeka): weißer Kopf mit Gültigkeit, Logo, Ort und Zusatz; darunter die Markenfarbe mit
    Slogan-Aufkleber, Hauptangebot rechts, 2 Angeboten links, einer Reihe weißer Karten und einer Schlusszeile. */
function drawCoverTop(ctx, size, margin, gap, flyer, settings, images, main, tiles, slots, bottom) {
  const headH = Math.round(size.w / PHI ** 3.6);
  const end = bottom + gap;
  const ground = paintArea(ctx, 0, headH, size.w, end - headH, flyer, settings, images, settings.farbePreis);
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, size.w, headH);
  // Kopf: kleine Gültigkeitszeile, darunter Logo links und Ort groß daneben
  ctx.save();
  ctx.textAlign = 'left';
  const img = images.get('logo');
  const logoTop = margin;
  const logoH = headH - margin * 2;
  const logoW = drawLogo(ctx, margin, logoTop, logoH, settings, img);
  const tx = margin * 2 + logoW;
  const room = size.w - margin - tx;
  const place = ortOf(settings) || settings.marktName;
  ctx.fillStyle = '#1B2420';
  const big = fitText(ctx, place, (s) => textFont(s, 900), logoH / PHI ** 0.2, room, 12);
  const valid = `${flyerTitle(flyer)} · Gültig von ${shortDate(flyer.from)} bis ${longDate(flyer.to)}`;
  const small = Math.min(big / PHI ** 1.6, size.w / PHI ** 6.6);
  const blockH = big * 0.8 + small * 1.5;
  const ty = logoTop + (logoH - blockH) / 2 + big * 0.8;
  ctx.fillText(place, tx, ty);
  fitText(ctx, valid, (s) => textFont(s, 700), small, room, 9);
  ctx.fillText(valid, tx, ty + small * 1.5);
  ctx.restore();
  // Unten: Schlusszeile in Weiß und darüber eine Reihe mit 4 weißen Karten
  const closing = mottoOf(flyer) || settings.zusatz || '';
  const closeH = size.w / PHI ** 5.6;
  const cardsH = (end - headH) / PHI ** 2.7;
  const cardsTop = end - closeH - gap - cardsH;
  withInk(ctx, { cardFill: '#FFFFFF' }, () => drawRows(ctx, [{ w: 1, cols: [1, 1, 1, 1] }], tiles.slice(2, 6), margin, cardsTop, size.w - margin * 2, cardsTop + cardsH, gap * 1.6, settings, images, slots, false, flyer));
  ctx.save();
  ctx.fillStyle = isLight(ground) ? settings.farbePreis : '#FFFFFF';
  ctx.textAlign = 'left';
  fitText(ctx, closing, (s) => textFont(s, 900), closeH * 0.62, size.w - margin * 2, 12);
  ctx.fillText(closing, margin, end - gap - closeH * 0.28);
  ctx.restore();
  // Mitte: links 2 Angebote untereinander, rechts das Hauptangebot; oben links der Slogan als gelber Aufkleber
  const top = headH + gap * 2;
  const heroBottom = cardsTop - gap * 2.4;
  const leftW = (size.w - margin * 2 - gap * 2) / PHI ** 2 * 1.15;
  const slogan = String(settings.slogan || '').trim();
  let leftTop = top;
  if (slogan) {
    ctx.save();
    const s = Math.min(size.w / PHI ** 5, leftW / 6);
    ctx.font = textFont(s, 900);
    const sw = Math.min(ctx.measureText(slogan).width + s * 1.2, leftW);
    const sh = s * 1.7;
    ctx.translate(margin + sw / 2, headH + gap * 2 + sh / 2);
    ctx.rotate(-Math.PI / 60);
    ctx.shadowColor = 'rgba(0,0,0,0.3)';
    ctx.shadowBlur = s / 2;
    ctx.fillStyle = settings.farbeKopf;
    roundRect(ctx, -sw / 2, -sh / 2, sw, sh, s / 4);
    ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.fillStyle = settings.farbePreis;
    ctx.textAlign = 'center';
    fitText(ctx, slogan, (z) => textFont(z, 900), s, sw - s * 1.2, 10);
    ctx.fillText(slogan, 0, s * 0.36);
    ctx.restore();
    leftTop = headH + sh + gap * 4;
  }
  withInk(ctx, {}, () => {
    drawRows(ctx, [{ w: 1, cols: [1] }, { w: 1, cols: [1] }], tiles.slice(0, 2), margin, leftTop, leftW, heroBottom, gap * 2, settings, images, slots, false, flyer);
    if (!main) return;

    drawMainStack(ctx, mx, top, size.w - margin - mx, heroBottom - top, main, settings, images, slots, size.w / 30);

/** Große Bühne (wie der iO-MARKT-Handzettel KW 41): Stimmungsbild oben, Logo und Gültigkeit oben links,
    Hauptangebot groß rechts, ein zweites Angebot links, darunter 3 × 3 Felder. */
function drawCoverStage(ctx, size, margin, gap, flyer, settings, images, main, tiles, slots, bottom, layout) {
  const stageH = Math.round(Math.min(size.h * layout.stage * stageScale(flyer), bottom - size.h / PHI ** 2.2));
  slots.stage = { x: 0, y: 0, w: size.w, h: stageH };

  const view = stageView(flyer);
  if (photo) drawCover(ctx, photo, 0, 0, size.w, stageH, view.fx, Boolean(flyer.stageMirror), view.zoom, view.fy);
  else { ctx.fillStyle = tint(settings.farbeKopf, 0.5); ctx.fillRect(0, 0, size.w, stageH); }

  slots.stage.mirror = Boolean(flyer.stageMirror);

  const logoH = size.w / PHI ** 4.9;
  drawLogo(ctx, margin, margin, logoH, settings, images.get('logo'));

  drawValidity(ctx, flyer, margin, margin + logoH + vs * 1.9, vs, 'left');

  const mx = size.w / PHI ** 1.9;
  const mw = size.w - margin - mx;

    const my = stageH / PHI ** 3.2;
    const mh = stageH - gap * 1.4 - my;
    drawMainFree(ctx, mx, my, mw, mh, main, settings, images.get(main.id), true);
    slots.push({ id: main.id, x: mx, y: my, w: mw, h: mh });
    const sideTop = tiles[0] ? stageH / PHI ** 0.95 : stageH - gap;
    withInk(ctx, glow, () => drawMainCopy(ctx, margin, infoBottom + gap * 2, mx - margin - gap, sideTop - infoBottom - gap * 3, main, size.w / 34));
  }
  // Zweites Angebot links unten auf der Bühne, Name und Text darunter, Preis rechts daneben
  const side = tiles[0];
  if (side) {
    const sw = size.w / PHI ** 2.4;
    const sy = stageH / PHI ** 0.95;
    const tagH = size.w / PHI ** 5.6;
    const tagW = tagH * PHI;
    const textH = stageH / PHI ** 4;
    const imgH = stageH - gap * 1.4 - textH - sy;
    const img = images.get(side.id);

    slots.push({ id: side.id, x: margin, y: sy, w: sw, h: stageH - sy });
  }
  drawRows(ctx, [ROW3, ROW3, ROW3], tiles.slice(1, 10), margin, stageH + gap * 2, size.w - margin * 2, bottom, gap * 1.6, settings, images, slots, false, flyer);
}
/** Innenseiten passend zum Grundlayout: bei „oben“ ein weißer Kopf auf Rot (Markenband links: ohne Band, seit 15.10.).
    Gibt die Fläche für die Felder zurück. */
function drawInnerLook(ctx, size, margin, gap, flyer, settings, images, look, bottom) {
  const end = bottom + gap;
  if (look === 'oben') {
    const hh = Math.round(size.w / PHI ** 5.4);
    paintArea(ctx, 0, hh, size.w, end - hh, flyer, settings, images, settings.farbePreis);
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, size.w, hh);
    const lh = hh - margin * 1.2;
    const lw = drawLogo(ctx, margin, margin * 0.6, lh, settings, images.get('logo'));
    ctx.save();
    ctx.fillStyle = '#1B2420';
    ctx.textAlign = 'left';
    fitText(ctx, ortOf(settings) || settings.marktName, (s) => textFont(s, 900), lh * 0.62, size.w / PHI ** 2.4, 10);
    ctx.fillText(ortOf(settings) || settings.marktName, margin * 2 + lw, margin * 0.6 + lh * 0.72);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#5C665F';
    ctx.font = textFont(lh / PHI ** 2.4, 600);
    ctx.fillText(`${flyerTitle(flyer)} · ${shortDate(flyer.from)} – ${longDate(flyer.to)}`, size.w - margin, margin * 0.6 + lh * 0.66);

/** Rezept-Band: links das KI-Bild des fertigen Gerichts, rechts Titel, Zutaten und Zubereitung in einer weißen Karte. */

    ctx.fillStyle = tint(settings.farbeKopf, 0.55);

/** So viele Seiten, wie für den Handzettel gewählt sind. In der Werkstatt zeigen freie Seiten einen Hinweis,
    beim Teilen (forExport) fallen leere Seiten weg. */
function buildSheets(flyer, settings, images, forExport = false) {
  const shown = onPage(flyer);
  const band = personPage(flyer);
  let specs;
  let at;
  if (coverStyle(flyer) === 'einladung') {
    const cover = layoutFor(flyer, 1);
    const room = coverRoom(cover);
    specs = [{ invite: { main: shown[0] || null }, layout: cover, layoutRows: cover.rows, tiles: shown.slice(1, 1 + room), footer: 'partner' }];
    at = 1 + room;
  } else {
    specs = [{ hero: shown[0] ? { main: shown[0], side: shown[1] || null } : null, tiles: shown.slice(2, 2 + SHEET.first), cols: SHEET.cols, rows: SHEET.firstRows, footer: 'partner' }];
    at = 2 + SHEET.first;
  }
  for (let n = 2; n <= pagesOf(flyer); n += 1) {
    const room = pageCapacity(flyer, n);
    const tiles = shown.slice(at, at + room);
    const info = themeOf(flyer, n);
    let sections = null;
    if (info && tiles.length) {
      const entry = flyer.themen[n];
      const k = Math.min(tiles.length, Math.max(1, Number.isFinite(entry.count) ? entry.count : tiles.length));
      sections = [{ info, items: tiles.slice(0, k) }];
      if (k < tiles.length) sections.push({ info: secondOf(flyer, n), items: tiles.slice(k), small: true });
    }
    const recipe = recipePage(flyer) === n;
    const breaker = breakerPage(flyer, n);
    specs.push({ hero: null, band: band === n && !recipe, recipe: recipe || breaker, theme: tiles.length ? null : info, sections, layoutRows: pageRows(flyer, n), tiles, footer: 'legal' });
    at += room;
  }
  // Auf jeder Seite (außer der letzten gefüllten) der Hinweis, dass es weitergeht
  specs.forEach((spec, i) => { const later = specs.slice(i + 1).reduce((s, x) => s + x.tiles.length, 0); spec.next = later; });
  specs.forEach((spec, i) => { spec.n = i + 1; });   // Seitennummer im Handzettel (für den Hintergrund je Seite)
  if (forExport) specs = specs.filter((spec, i) => i === 0 || spec.tiles.length || spec.band || spec.recipe);
  specs.forEach((spec, i) => { spec.page = i + 1; spec.pages = specs.length; spec.hint = !forExport; });
  return specs.map((spec) => drawSheet(SHEET, spec, flyer, lookOfPage(flyer, spec.n || spec.page), images));
}
function buildPages(flyer, settings, images) {
  const { main, rest } = layoutOf(flyer);
  if (!main) return { phone: [], seiten: [] };
  const counts = pageCounts(flyer);
  const phone = [drawSheet(PHONE, { hero: { main, side: null }, tiles: [], footer: 'legal', page: 1, pages: counts.phone }, flyer, settings, images)];
  chunk(rest, PHONE.cols * PHONE.rows).forEach((tiles, i) => phone.push(drawSheet(PHONE, { hero: null, head: true, tiles, cols: PHONE.cols, rows: PHONE.rows, footer: 'legal', page: i + 2, pages: counts.phone }, flyer, settings, images)));
  return { phone, seiten: buildSheets(flyer, settings, images, true) };
}

/* ---------- Dateien speichern ---------- */
async function saveFile(filename, blob) {
  const inViewer = Boolean(window.claude && typeof window.claude.use === 'function');
  if (inViewer) {
    let downloads = null;
    try { downloads = await window.claude.use('downloads'); } catch (error) { downloads = null; }
    if (!downloads) { toast('Speichern geht hier nicht. Tipp: Bild lange gedrückt halten und sichern.'); return; }
    try {
      await downloads.save({ filename, data: blob });
      toast(`Gespeichert: ${filename}`);
    } catch (error) {
      const code = error && error.code;
      if (code === 'declined') toast('Speichern abgebrochen.');
      else if (code === 'rate_limited') toast('Bitte kurz warten und noch einmal tippen.');
      else toast('Speichern geht hier nicht. Tipp: Bild lange gedrückt halten und sichern.');
    }
    return;
  }
  const url = URL.createObjectURL(blob);
  const link = el('a', { href: url, download: filename });
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* ---------- Dialoge ---------- */
function openDialog(title, build) {
  const dialog = el('dialog', { 'aria-label': title });
  const close = () => dialog.close();
  dialog.addEventListener('close', () => dialog.remove());
  dialog.addEventListener('click', (event) => { if (event.target === dialog) close(); });
  const body = el('div', { class: 'dlg-body' });
  const foot = el('div', { class: 'dlg-foot' });
  dialog.append(
    el('div', { class: 'dlg-head' }, el('h2', { text: title }), el('button', { class: 'icon quiet', type: 'button', 'aria-label': 'Schließen', onclick: close }, '✕')),
    body, foot,
  );
  build({ body, foot, close });
  if (!foot.childElementCount) foot.remove();
  document.body.append(dialog);
  dialog.showModal();
  return dialog;
}

const lookOf = (flyer) => {
  const base = flyer && flyer.hintergrund && BACKGROUNDS.some((b) => b.id === flyer.hintergrund)
    ? { ...state.settings, hintergrund: flyer.hintergrund, farbeGrund: flyer.farbeGrund || state.settings.farbeGrund }
    : state.settings;
  return flyer && Number.isFinite(Number(flyer.bgIntensity)) && flyer.bgIntensity !== null ? { ...base, bgIntensity: Number(flyer.bgIntensity) } : base;

const PDF_LIBRARY = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';

function loadQrLibrary() {

/** Liest alle Textstücke eines PDFs mit Seite und Position (Ursprung oben links). */
async function readPdfItems(file) {
  const lib = await loadPdfLibrary();
  const pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const items = [];
  for (let n = 1; n <= pdf.numPages; n += 1) {
    const page = await pdf.getPage(n);
    const height = page.getViewport({ scale: 1 }).height;
    const content = await page.getTextContent();
    for (const item of content.items) {
      const s = String(item.str || '').trim();

}
/** Ein Etikett endet mit der Zeile "BEH:". Davor stehen Name, Preis, Grundpreis, EAN und Artikelnummer. */
function parseLabels(items, pageWidth = 595) {
  const labels = [];
  const columns = new Map();
  for (const item of items) {
    const key = `${item.p}:${item.x < pageWidth / 2 ? 0 : 1}`;
    if (!columns.has(key)) columns.set(key, []);
    columns.get(key).push(item);
  }
  const keys = [...columns.keys()].sort((a, b) => { const [pa, ca] = a.split(':').map(Number); const [pb, cb] = b.split(':').map(Number); return pa - pb || ca - cb; });
  for (const key of keys) {
    const sorted = columns.get(key).sort((a, b) => a.y - b.y || a.x - b.x);
    const lines = [];
    for (const item of sorted) {
      const last = lines[lines.length - 1];
      if (last && item.y - last.y <= 3) last.parts.push(item);
      else lines.push({ y: item.y, parts: [item] });
    }
    let block = [];
    for (const line of lines) {
      const text = line.parts.sort((a, b) => a.x - b.x).map((part) => part.s).join(' ');
      block.push(text);
      if (!text.includes('BEH:')) continue;
      const label = labelFromLines(block);
      if (label) labels.push(label);
      block = [];
    }
  }
  return labels;
}
function labelFromLines(lines) {
  const priceAt = lines.findIndex((line) => /\d+,\d{2}\s?€/.test(line));
  if (priceAt < 1) return null;
  const price = parsePrice(/(\d+,\d{2})\s?€/.exec(lines[priceAt])[1]);
  const baseLine = lines.slice(priceAt + 1).find((line) => /\d+,\d{2}\s?€/.test(line)) || '';
  const baseMatch = /^(.*?)(\d+,\d{2})\s?€/.exec(baseLine);
  const unit = baseMatch ? baseMatch[1].replace(/\s+/g, ' ').trim() : '';
  const eanLine = lines.find((line) => /^\d{8,13}\b/.test(line) && !line.includes('BEH:') && !/^\d{8}$/.test(line.trim())) || '';
  const artLine = lines.find((line) => /^\d{8}$/.test(line.trim())) || '';

  if (!name || !price) return null;
  return { name, price, base: baseMatch && unit && !/st(ü|u)ck/i.test(unit) ? `${unit.replace(/^1\s?/, '1 ')} = ${baseMatch[2]}` : '', ean: (/^\d{8,13}/.exec(eanLine) || [''])[0], artnr: artLine.trim() };
}
const tokensOf = (text) => String(text).toLowerCase().replace(/[´'`‘’]/g, '').split(/[^a-z0-9äöüß]+/).filter((t) => t.length >= 3 && !/^\d/.test(t));

  || (Math.min(a.length, b.length) >= 4 && (a.startsWith(b) || b.startsWith(a)))
  || (Math.min(a.length, b.length) >= 5 && (a.includes(b) || b.includes(a)));

function matchLabels(flyer, labels) {
  const targets = flyer.items.map((item) => ({ item, name: tokensOf(item.name), all: tokensOf(`${item.name} ${item.inhalt}`) }));
  const byItem = new Map();
  const rest = [];
  for (const label of labels) {
    const tokens = tokensOf(label.name).slice(0, 4);
    const candidates = targets.map((target) => ({
      target,
      brand: tokens.slice(0, 2).some((t) => target.name.some((n) => tokenMatch(t, n))),
      score: tokens.filter((t) => target.all.some((n) => tokenMatch(t, n))).length,
      same: target.item.price === label.price,
    })).filter((c) => c.brand).sort((a, b) => b.score - a.score || Number(b.same) - Number(a.same));
    const best = candidates[0];
    if (best && (best.score >= 2 || best.same || candidates.length === 1)) {
      if (!byItem.has(best.target.item.id)) byItem.set(best.target.item.id, []);
      byItem.get(best.target.item.id).push({ ...label, unsure: best.score < 2 && !best.same });

  const extras = new Map();
  for (const label of rest) {
    const key = `${tokensOf(label.name).slice(0, 2).join(' ')}|${label.price}`;
    if (!extras.has(key)) extras.set(key, []);

  const shared = [];
  for (let i = 0; i < words[0].length; i += 1) {
    if (words.every((list) => list[i] === words[0][i])) shared.push(words[0][i]); else break;
  }
  if (shared.length) return shared.join(' ');
  // Kein gemeinsames Wort: gemeinsamer Wortanfang, z. B. "Krüg.Fam.Cappu."
  let prefix = labels[0].name;

  return prefix.trim().length >= 4 ? prefix.trim() : labels[0].name;
}

}

/* ---------- Etiketten der Woche: sie bestimmen den Handzettel ---------- */
/* Die Regaletiketten zeigen, was im Markt wirklich im Angebot ist und zu welchem Preis. Nur was ein Etikett hat,
   kommt in den Handzettel. Name, Werbetext und Bild kommen aus Lünings Handzettel der Woche (falls vorhanden),
   sonst aus dem Sortiment (nach EAN). Artikel eigener Lieferanten bleiben, sie haben keine Lüning-Etiketten. */
const weekOf = (flyer) => weeks.find((w) => weekDates(w).from === flyer.from) || null;
const ownItem = (item) => item.group === OWN_GROUP || Boolean(item.lieferant);
function planFromLabels(flyer, labels) {
  const own = flyer.items.filter(ownItem);
  // Vorlagen: die Artikel der Woche (mit Änderungen des Anwenders) und Lünings Wochenangebote, die noch fehlen
  const known = flyer.items.filter((item) => !ownItem(item));
  const week = weekOf(flyer);
  const fromWeek = week ? week.artikel.map(itemFromWeek).filter((w) => !known.some((k) => (k.bild && k.bild === w.bild) || ownKey(k.name) === ownKey(w.name))) : [];
  const pool = { items: [...known, ...fromWeek] };
  const { byItem, extras } = matchLabels(pool, labels);
  const items = [];
  const changes = [];
  for (const item of pool.items) {
    const mine = byItem.get(item.id);
    if (!mine) continue;
    const price = Math.min(...mine.map((label) => label.price));
    if (price !== item.price) changes.push({ name: item.name, from: item.price, to: price });
    items.push({ ...item, price, carried: false, ean: item.ean || mine[0].ean, etiketten: mine.map((l) => ({ name: l.name, price: l.price, ean: l.ean })),
      inhalt: mine.length > 1 && !/versch/i.test(item.inhalt || '') ? ['versch. Sorten', item.inhalt].filter(Boolean).join('\n') : item.inhalt });
  }
  // Hauptangebot zuerst: Lünings Titelangebot, sonst das bisherige
  items.sort((a, b) => Number(Boolean(b.star)) - Number(Boolean(a.star)));
  const added = extras.map((group) => ({ ...itemFromLabels(group), etiketten: group.map((l) => ({ name: l.name, price: l.price, ean: l.ean })) }));
  const all = [...items, ...added, ...own];
  // Aufs Hauptangebot nur ein Angebot mit großem Bild (sonst „Bild zu klein“): das beste nach vorn
  const main = bestMain(all);
  if (main && all[0] !== main) { all.splice(all.indexOf(main), 1); all.unshift(main); }
  const dropped = pool.items.filter((item) => !byItem.has(item.id) && known.includes(item));

/* Dort steht je Auslieferungswoche und Aktion, was der Markt bestellt hat: Artikelnummer, Bezeichnung, LVP, Menge.

const STORE_BRANDS = ['edeka', 'gut', 'g&g', 'ja!'];

    if (week) { delivery = Number(week[1]); continue; }
    const head = /^Aktion:\s*(\d+)\s*-\s*(.*?)\s+Artikelnummer\s+Bezeichnung\s+LVP\s+Menge/.exec(part);
    if (!head) continue;
    const rows = [];
    for (const m of part.slice(head[0].length).matchAll(/(\d{8})\s+(.+?)\s+(\d{1,4}[.,]\d{1,2})\s+(\d{1,4})(?=\s+\d{8}\s|\s+\D|\s*$)/g)) {

/** Bildaufbau, den das gewählte Layout der Titelseite braucht: Format des Bildfelds, wo die Person/das Motiv steht

  if (layout.custom === 'links') {

      free: ['Das untere Drittel bleibt ruhig und einfarbig-unscharf, dort liegt später ein schräges Farbband mit dem Logo.',
        'Auch die untere rechte Ecke bleibt frei, dort steht das Angebot mit Preis.'] };
  }

  return { name: designOf(flyer).name, format, subject: 'nur im linken Drittel des Bildes (höchstens bis 35 % der Breite)',
    free: ['Die gesamte rechte Bildhälfte bleibt leer – keine Gegenstände, keine Zutaten, keine Deko. Dort nur ruhiger, heller, unscharfer Hintergrund (z. B. Himmel, Wand, Fenster) und freie Tischfläche.',

      ['#F2A7C7', m, 54, 38, 30], ['#F2A7C7', m, 88, 38, 30], ['#FFFFFF', 52, 40, w - 52 - m, 80], [yellow, w - m - 28, 104, 28, 16],
      ...[0, 1, 2, 3].map((i) => ['#FFFFFF', m + i * (cw + g), 126, cw, 26]), ['#FFFFFF', m, 156, 50, 5], [red, 0, h - 9, w, 9]]);

/** Schlägt Themenseiten vor: Seite 1 bleibt, jede weitere Seite bekommt das Thema mit den meisten passenden
    Angeboten (mindestens 3). Fehlen Artikel, wird mit Angeboten ohne gewähltes Thema aufgefüllt. */
function proposeThemes(flyer) {
  const first = pageCapacity(flyer, 1);
  const keep = flyer.items.slice(0, first);
  let rest = flyer.items.slice(first);
  const themen = {};
  const order = [...keep];
  const used = new Set();
  for (let n = 2; n <= pagesOf(flyer); n += 1) {
    const room = pageCapacity(flyer, n);
    const counts = THEMES.filter((th) => !used.has(th.id)).map((th) => ({ th, items: rest.filter((item) => th.words.test(themeWords(item))) }))
      .sort((a, b) => b.items.length - a.items.length);
    const best = counts[0];
    if (!best || best.items.length < 3) { order.push(...rest.splice(0, room)); continue; }
    used.add(best.th.id);
    const mine = best.items.slice(0, room);
    rest = rest.filter((item) => !mine.includes(item));
    // Restplatz: zweites Thema als eigener Abschnitt, sonst „Weitere Angebote“
    const free = room - mine.length;
    let second = null;
    let fill = [];
    if (free >= 3) {
      const next = THEMES.filter((th) => !used.has(th.id)).map((th) => ({ th, items: rest.filter((item) => th.words.test(themeWords(item))) }))
        .filter((x) => x.items.length >= 3).sort((a, b) => b.items.length - a.items.length)[0];
      if (next) { second = next.th.id; used.add(second); fill = next.items.slice(0, free); }
    }
    rest = rest.filter((item) => !fill.includes(item));
    while (mine.length + fill.length < room && rest.length) fill.push(rest.shift());
    order.push(...mine, ...fill);
    themen[n] = { id: best.th.id, count: mine.length, id2: second };
  }
  order.push(...rest);
  return { order, themen };
}
